<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smashcraft</title>
<meta name="description" content="Smashcraft is a platform fighter made as a Warcraft III custom map.">
<meta property="og:title" content="Smashcraft">
<meta property="og:description" content="A platform fighter made as a Warcraft III custom map.">
<meta property="og:image" content="https://tompassarelli.github.io/smashcraft/smashcraft-by-tompas.jpg">
<style>
  :root { --bg: #0d1014; --panel: #161b22; --edge: #2a323d; --text: #e8e4da; --muted: #9aa3ad; --accent: #e0b04a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  img { display: block; width: 100%; height: auto; border-radius: 10px; }
  h1 { margin: 28px 0 4px; font-size: 2.2rem; letter-spacing: 0.02em; }
  p { margin: 0 0 24px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 600; }
  a.link:hover, a.link:focus-visible { border-color: var(--accent); outline: none; }
  a.link span { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <img src="smashcraft-by-tompas.jpg" alt="Smashcraft by Tompas" width="1200" height="676">
  <h1>Smashcraft</h1>
  <p>A platform fighter made as a Warcraft III custom map.</p>
  <ul>
    <li><a class="link" href="https://github.com/tompassarelli/smashcraft">GitHub <span>source, releases and issues</span></a></li>
  </ul>
</main>
</body>
</html>
