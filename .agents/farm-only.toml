[[command]]
pattern = ["bun", "wisp", "combos", "--advantage"]
narrowing = ["--fighter"]
farm = "rerun with --fighter NAME per fighter"
why = "whole-roster advantage sweep, about 6 cores"

[[command]]
pattern = ["bun", "wisp", "combos"]
narrowing = ["--fighter", "--objectives"]
farm = "rerun with --fighter NAME per fighter"
why = "whole-roster combo generator"

[[command]]
pattern = ["bun", "wisp", "interactions"]
narrowing = ["--fighter"]
farm = "rerun with --fighter NAME per fighter"
why = "whole-roster interaction generator"

[[command]]
pattern = ["bun", "test"]
narrowing = ["--test-name-pattern", "-t", "--filter"]
farm = "bun wisp farm test --ref <sha> --wait"
why = "full Bun suite belongs on the farm"

[[command]]
pattern = ["bun", "run", "test"]
narrowing = ["--test-name-pattern", "-t", "--filter"]
farm = "bun wisp farm test --ref <sha> --wait"
why = "full Bun suite belongs on the farm"

[[command]]
pattern = ["bun", "scripts/lua-tests.ts"]
narrowing = []
farm = "bun wisp farm test --ref <sha> --wait"
why = "full Lua32 suite belongs on the farm"

[[command]]
pattern = ["bun", "scripts/cpuField.ts"]
narrowing = ["--pair", "--pairs", "--matchups", "--fighter", "--merge"]
farm = "bun wisp farm balance --ref <sha> --wait"
why = "whole-roster balance field"

[[command]]
pattern = ["bun", "wisp", "soak"]
narrowing = ["--fighter", "--pair", "--repro"]
farm = "bun wisp farm memory --ref <sha> --wait"
why = "soak sweep belongs on the farm"

[[command]]
pattern = ["bun", "scripts/playtest.ts"]
narrowing = ["--repro", "--merge", "--issues"]
farm = "gh workflow run playtest.yml -f ref=<sha>"
why = "roster playtest sweep belongs on the farm"

[[command]]
pattern = ["bun", "scripts/generated.ts"]
narrowing = []
farm = "bun wisp farm test --ref <sha> --wait (the farm regenerates every generated file)"
why = "regenerates every generated file for the whole roster, up to its 8 GiB cap"
