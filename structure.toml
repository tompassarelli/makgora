# smashcraft structure.toml (structure-architect planner, 15 Oct 2026). Lands at repo root as structure.toml.
# Modules name the TARGET layers (smashcraft-design.md section 1) and map today's paths onto them, so existing
# edges are frozen debt and new edges must follow the target DAG. Each refactor slice moves paths here in the same change.
# First matching module wins: specific globs come before their directory's catch-all.

[thresholds]
file_lines = 500            # hand .ts p50 86, p90 328, p95 438 (806 files); 49 ts/src files over 400 are frozen, not blocked
function_lines = 80
function_complexity = 15
hotspot_top = 10

[review]
commits = 700
hand_lines_added = 40000
days = 7
hotspot_score = 0

# ---------- tests: may reach any layer; nothing may import them ----------
[[module]]
name = "tests"
thresholds = { function_lines = 150, function_complexity = 30 }
paths = ["**/*.tests.ts", "**/*.test.ts", "**/*.soak.ts", "ts/test/**"]
responsibility = "Colocated Lua tests, Bun integration tests and their helpers."
may_use = ["core", "input", "generated", "sim", "fighter-kit", "snapshot", "ai", "roster", "lobby", "match", "replay", "netcode", "fighter-look", "presentation", "render", "ui", "session", "classic", "host", "scripts", "tools", "references"]

# ---------- generated (exempt from size rules via [[generated]]; module only for import direction) ----------
[[module]]
name = "generated"
paths = [
  "ts/src/generated/**",
  "ts/src/game/assets/stockSoundInfo.ts",
  "ts/src/game/assets/modelSoundInfo.ts", "ts/src/game/assets/impactAssetInfo.ts", "ts/src/game/assets/shieldAssetInfo.ts",
  "ts/src/game/assets/frostAssetInfo.ts", "ts/src/game/assets/stageAssetInfo.ts", "ts/src/game/assets/stageSkyInfo.ts",
  "ts/src/game/assets/terrainAssetInfo.ts",
  "ts/src/game/presentation/*ClipInfo.ts", "ts/src/game/presentation/*AssetInfo.ts", "ts/src/game/presentation/drawnStrideInfo.ts",
  "ts/src/game/presentation/reachCueInfo.ts", "ts/src/game/presentation/cueEmitterInfo.ts", "ts/src/game/presentation/heroStrikeMomentInfo.ts",
  "ts/src/game/presentation/fighterViewBounds.ts",
  "ts/src/game/presentation/heroes/cairneClips.ts", "ts/src/game/presentation/heroes/jainaClips.ts", "ts/src/game/presentation/heroes/malfurionClips.ts",
  "ts/src/game/presentation/heroes/medivhClips.ts", "ts/src/game/presentation/heroes/peonClips.ts", "ts/src/game/presentation/heroes/sylvanasClips.ts",
  "ts/src/game/presentation/heroes/thrallClips.ts", "ts/src/game/presentation/heroes/*ClipInfo.ts",
  "ts/src/game/menu/stageSilhouettes.ts", "ts/src/game/sim/heroes/releaseRoster.ts",
]
responsibility = "Producer output compiled into the map: clips, asset tables, view facts, math tables, generated state ops."
may_use = ["core"]

# ---------- core ----------
[[module]]
name = "core"
paths = ["ts/src/game/core/**", "ts/src/game/sim/codes.ts", "ts/src/game/input/participants.ts", "ts/src/runtime/numbers.ts",
         "ts/src/sim/**", "ts/src/game/sim/mathTables.ts", "ts/src/game/sim/mathTableData.ts"]
responsibility = "Ids, participant slot constants, number helpers and trig tables (mathTableData is generated, see below); no game logic."
may_use = []

[[module]]
name = "input"
paths = ["ts/src/game/input/**"]
responsibility = "Action vocabulary, key bindings, pad packet decode and the I4/I5 wire; owner of the controller contract."
may_use = ["core"]

# ---------- gameplay ----------
[[module]]
name = "fighter-kit"
paths = ["ts/src/game/fighters/*/kit.ts", "ts/src/game/fighters/*/moves.ts", "ts/src/game/fighters/*/specials.ts", "ts/src/game/fighters/*/ultimate.ts",
         "ts/src/game/sim/heroes/*Hero.ts", "ts/src/game/sim/heroes/*Moves.ts", "ts/src/game/sim/heroes/*Specials.ts",
         "ts/src/game/sim/heroes/groundNormals.ts", "ts/src/game/sim/heroes/heroBodies.ts", "ts/src/game/sim/heroes/multiHit.ts",
         "ts/src/game/sim/heroes/wardenSpin.ts", "ts/src/game/sim/heroes/forsakenPaladin*.ts", "ts/src/game/sim/heroes/authoring.ts",
         "ts/src/game/sim/heroes/hero.ts", "ts/src/game/stages/*/deck.ts"]
responsibility = "One fighter's (or stage's) gameplay data and hooks: frame data, specials, ultimate, body, traits, deck geometry."
may_use = ["sim", "core", "generated"]

[[module]]
name = "ai"
paths = ["ts/src/game/ai/**", "ts/src/game/fighters/*/gameplan.ts", "ts/src/game/sim/heroes/*Gameplan.ts",
         "ts/src/game/match/bot*.ts", "ts/src/game/match/cpu*.ts", "ts/src/game/match/edgeGuard*.ts", "ts/src/game/match/recoveryEnvelope.ts"]
responsibility = "Bots, perception, CPU profiles and per-fighter gameplans."
may_use = ["snapshot", "sim", "fighter-kit", "input", "core", "generated"]

[[module]]
name = "roster"
paths = ["ts/src/game/roster/**", "ts/src/game/sim/heroes/registry.ts", "ts/src/game/objectData.ts", "ts/src/game/menu/stageCatalog.ts"]
responsibility = "The only all-fighter and all-stage registries."
may_use = ["fighter-kit", "fighter-look", "ai", "sim", "core", "generated"]

[[module]]
name = "snapshot"
paths = ["ts/src/game/snapshot/**", "ts/src/game/replay/canonical.ts", "ts/src/game/replay/fighterState.ts", "ts/src/game/replay/difference.ts",
         "ts/src/game/replay/history.ts", "ts/src/game/replay/snapshot.ts", "ts/src/game/replay/scopedRepair.ts",
         "ts/src/game/replay/frameDigest.ts", "ts/src/game/replay/limits.ts"]
responsibility = "Canonical text, state hash, copy/compare/diff of world state and the rollback ring."
may_use = ["sim", "fighter-kit", "core", "generated"]

[[module]]
name = "lobby"
paths = ["ts/src/game/lobby/**"]
responsibility = "Lobby state: slots, humans/CPU, character and stage select, teams, stock and timer choice."
may_use = ["roster", "core"]

[[module]]
name = "match"
paths = ["ts/src/game/match/**"]
responsibility = "Match step, stocks/teams/meter rules and training; drives the sim each frame."
may_use = ["lobby", "roster", "ai", "snapshot", "sim", "fighter-kit", "input", "core", "generated"]

[[module]]
name = "replay"
paths = ["ts/src/game/replay/**"]
responsibility = "Replay files, tapes, moments and the viewer driver."
may_use = ["match", "lobby", "roster", "snapshot", "sim", "input", "core", "generated"]

[[module]]
name = "netcode"
paths = ["ts/src/game/netcode/**"]
responsibility = "Delay policy and input journals."
may_use = ["match", "snapshot", "input", "core"]

# ---------- presentation ----------
[[module]]
name = "fighter-look"
paths = ["ts/src/game/fighters/*/look.ts", "ts/src/game/fighters/*/cues.ts", "ts/src/game/fighters/*/sounds.ts", "ts/src/game/stages/*/look.ts",
         "ts/src/game/presentation/model/**", "ts/src/game/presentation/heroes/**", "ts/src/game/sim/heroes/*Clips.ts",
         "ts/src/game/assets/stageLighting.ts", "ts/src/game/assets/stagePalette.ts", "ts/src/game/assets/stagePointLights.ts",
         "ts/src/game/assets/importedModelInfo.ts"]
responsibility = "One fighter's or stage's look (model, clip binding, cues, sounds, scale, labels) and the presentation types."
may_use = ["fighter-kit", "core", "generated"]

# sim sits after fighter-look so sim/heroes/*Clips.ts matches fighter-look first.
[[module]]
name = "sim"
paths = ["ts/src/game/sim/**", "ts/src/game/physics/**"]
responsibility = "Deterministic per-frame simulation engine and Fighter state; no natives, presentation or input layer."
may_use = ["core", "generated"]

[[module]]
name = "presentation"
paths = ["ts/src/game/presentation/**", "ts/src/game/assets/**"]
responsibility = "Pose and clip choice, cue and sound selection; pure, no natives."
may_use = ["fighter-look", "roster", "match", "lobby", "snapshot", "sim", "fighter-kit", "ai", "input", "core", "generated"]

[[module]]
name = "render"
paths = ["ts/src/game/render/**"]
responsibility = "Warcraft-native effect drawing and sound playback."
may_use = ["presentation", "fighter-look", "roster", "match", "sim", "core", "generated"]

[[module]]
name = "ui"
paths = ["ts/src/game/ui/**", "ts/src/game/menu/**"]
responsibility = "Frames, menus and selection screens."
may_use = ["render", "presentation", "fighter-look", "lobby", "roster", "match", "sim", "input", "core", "generated"]

[[module]]
name = "session"
paths = ["ts/src/game/session/**", "ts/src/game/shell/**"]
responsibility = "Session setup, playback, dev settings and the match record writer."
may_use = ["ui", "render", "presentation", "fighter-look", "replay", "netcode", "match", "lobby", "roster", "ai", "snapshot", "sim", "input", "core", "generated"]

[[module]]
name = "classic"
paths = ["ts/src/game/classic/**"]
responsibility = "Classic mode routes and lore battles."
may_use = ["session", "ui", "match", "lobby", "roster", "sim", "core", "generated"]

[[module]]
name = "host"
paths = ["ts/src/host/**", "ts/src/platform/**", "ts/src/runtime/**", "ts/src/parity/**", "ts/src/**"]
responsibility = "Map entry points and the live loop (view, keys, rollback tick)."
may_use = ["classic", "session", "ui", "render", "presentation", "fighter-look", "replay", "netcode", "match", "lobby", "roster", "ai", "snapshot", "sim", "fighter-kit", "input", "core", "generated"]

# ---------- host-side tooling ----------
[[module]]
name = "scripts"
thresholds = { function_lines = 150, function_complexity = 30 }
paths = ["ts/scripts/**", "ts/commands/**", "ts/bin/**", "ts/host/**", "ts/landing/**", "ts/analysis/**", "ts/art/**", "ts/native/**",
         "ts/testing/**", "ts/codegen/**", "ts/generated/**", "ts/plugins/**", "ts/*.ts"]
responsibility = "bun wisp verbs, landing bots, sim analysis harnesses, codegen and the test runner."
may_use = ["host", "classic", "session", "ui", "render", "presentation", "fighter-look", "replay", "netcode", "match", "lobby", "roster", "ai", "snapshot", "sim", "fighter-kit", "input", "core", "generated", "references"]

[[module]]
name = "host-tools"
paths = ["tools/smashcraft-tools/**"]
responsibility = "smashcraft-tools (Rust): Warcraft III menu observation and input procedures, and the animation asset extractors."
may_use = []

[[module]]
name = "tools"
thresholds = { function_lines = 150, function_complexity = 30 }
paths = ["tools/**"]
responsibility = "Art, stage, effect and Slippi pipelines that write generated files."
may_use = ["scripts", "host", "presentation", "fighter-look", "roster", "match", "sim", "fighter-kit", "input", "core", "generated", "references"]

[[module]]
name = "references"
thresholds = { function_lines = 150, function_complexity = 30 }
paths = ["references/**"]
responsibility = "Public Melee reference data, its intakes and its typed readers."
may_use = []

[[module]]
name = "controller"
paths = ["controller/**"]
responsibility = "The wc3-journal padbridge plug-in (Rust): pad capture, journal mailbox, menu lifecycle."
may_use = []

