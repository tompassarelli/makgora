name: Autoland heartbeat

# Lives only while Autoland has work (smashcraft:docs/ci.md#autoland-sweep): Autoland's plan and the sweep start it when none runs.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: autoland-heartbeat
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  beat:
    if: vars.AUTOLAND_HEARTBEAT != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - run: |
          set -uo pipefail
          started=$(date +%s); idle_since=""
          busy() {
            local runs lanes
            lanes=$(gh api graphql --paginate -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -f query='
              query($owner: String!, $name: String!, $endCursor: String) { repository(owner: $owner, name: $name) {
              refs(refPrefix: "refs/heads/claude/", first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor }
              nodes { target { ... on Commit { status { context(name: "autoland") { state } } } } } } } }' \
              --jq '.data.repository.refs.nodes[] | select(.target.status.context.state == "PENDING") | 1' | wc -l)
            [ "$lanes" = 0 ] || { echo "$(date -u +%H:%M:%SZ) $lanes lanes pending"; return 0; }
            runs=0
            for workflow in autoland.yml farm-test.yml; do for state in requested pending waiting queued in_progress; do
              runs=$(( runs + $(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?status=$state&per_page=1" --jq .total_count) ))
            done; done
            echo "$(date -u +%H:%M:%SZ) $runs unfinished Autoland and Farm test runs, no lane pending"
            [ "$runs" -gt 0 ]
          }
          while true; do
            if busy; then
              idle_since=""
            elif [ -z "$idle_since" ]; then
              idle_since=$(date +%s)
            elif [ $(( $(date +%s) - idle_since )) -ge 600 ]; then
              echo "Autoland has been empty for 10 minutes: stopping" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh workflow run autoland-sweep.yml --ref main || echo "::warning::couldn't start a sweep at $(date -u +%H:%M:%SZ)"
            if [ $(( $(date +%s) - started )) -ge $(( 330 * 60 )) ]; then
              gh workflow run autoland-heartbeat.yml --ref main || echo "::warning::couldn't start the next heartbeat"
              echo "Handed off to the next heartbeat after 5.5 hours" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 300
          done
