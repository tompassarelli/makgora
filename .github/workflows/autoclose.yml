name: Auto-close

# After a landing (a safe-push to main, or Autoland's dispatch), reruns each referenced issue's declared Done-when checks on the new main (smashcraft:docs/ci.md#auto-close).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The landed main commit
        required: true
      base:
        description: Main before the landing; the issues come from Refs/Fixes/Closes in base..sha
        required: true

run-name: Auto-close ${{ inputs.sha || github.sha }}

permissions:
  contents: read
  issues: write

concurrency:
  group: autoclose
  cancel-in-progress: false
  queue: max

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHA: ${{ inputs.sha || github.sha }}
      BASE: ${{ inputs.base || github.event.before }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Read the referenced issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issues"
          git log --format=%B "$BASE..$SHA" > "$RUNNER_TEMP/messages"
          for issue in $(bun ts/scripts/autoland.ts refs --messages "$RUNNER_TEMP/messages"); do
            gh api "repos/$GH_REPO/issues/$issue" > "$RUNNER_TEMP/issue.json" || continue
            if ! jq -e '.state == "open" and .pull_request == null and (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))' "$RUNNER_TEMP/issue.json" > /dev/null; then
              echo "#$issue: skipped (closed, a pull request, or opened by someone without write access)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            jq -r '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issues/$issue.md"
          done
          cat "$RUNNER_TEMP"/issues/*.md 2> /dev/null | bun ts/scripts/autoland.ts checks | sort -u > "$RUNNER_TEMP/checks" || true
          echo "Issues: $(ls "$RUNNER_TEMP/issues" | sed 's/\.md$//' | tr '\n' ' '); checks: $(grep -c . "$RUNNER_TEMP/checks" || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the declared checks
        working-directory: ts
        run: |
          set -uo pipefail
          while IFS= read -r check; do
            [ -n "$check" ] || continue
            echo "::group::$check" >&2
            if timeout 600 bash -c "$check" < /dev/null >&2; then passed=true; else passed=false; fi
            echo "::endgroup::" >&2
            echo "\`$check\`: $passed" >> "$GITHUB_STEP_SUMMARY"
            jq -cn --arg check "$check" --argjson passed "$passed" '{check: $check, passed: $passed}'
          done < "$RUNNER_TEMP/checks" | jq -s . > "$RUNNER_TEMP/results.json"
      - name: Tick, comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for file in "$RUNNER_TEMP"/issues/*.md; do
            [ -f "$file" ] || continue
            issue=$(basename "$file" .md)
            gh api "repos/$GH_REPO/issues/$issue" --jq '.body // ""' > "$file" || continue
            bun ts/scripts/autoland.ts autoclose --body "$file" --results "$RUNNER_TEMP/results.json" --sha "$SHA" > "$RUNNER_TEMP/decision.json" || continue
            if ! jq -r '.body' "$RUNNER_TEMP/decision.json" | cmp -s - "$file"; then
              jq '{body}' "$RUNNER_TEMP/decision.json" | gh api -X PATCH "repos/$GH_REPO/issues/$issue" --input - > /dev/null || { echo "::warning::couldn't tick #$issue"; continue; }
            fi
            marker=$(jq -r '.marker' "$RUNNER_TEMP/decision.json")
            if jq -e '.comment' "$RUNNER_TEMP/decision.json" > /dev/null \
              && ! gh api "repos/$GH_REPO/issues/$issue/comments?per_page=100" --jq '.[].body' | grep -qF "$marker"; then
              printf '%s\n\n(%s)\n%s\n' "$(jq -r '.comment' "$RUNNER_TEMP/decision.json")" "$RUN_URL" "$marker" | gh issue comment "$issue" --body-file - > /dev/null || echo "::warning::couldn't comment on #$issue"
            fi
            if jq -e '.close' "$RUNNER_TEMP/decision.json" > /dev/null; then
              gh issue close "$issue" --reason completed > /dev/null && echo "#$issue: closed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "#$issue: $(jq -r '.comment // "no declared checks" | split("\n")[0]' "$RUNNER_TEMP/decision.json")" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
