name: CI

on:
  pull_request:
  push:
    # Farm scratch branches and claude/ branches run only the workflow that checks them; codex/ review and probe/ balance candidates run none.
    branches-ignore: ["farm/**", "claude/**", "codex/**", "probe/**"]
  # Autoland's pushes to main start no workflows, so it dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

# Every landing on main gets its own run, so a red run names the landing that broke it;
# on other refs a newer push replaces only the queued run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: false

# A landing runs only the farm checks its changed paths can affect (farm-test.yml),
# so every landing on main, pushed by safe-push or dispatched by Autoland, runs every job below.
env:
  SWEEP_PLACEMENT: gate

jobs:
  # This commit's p95 frame cost, allocation and map script size on main, in the job summary and log (`grep commit-metrics`).
  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: the playable map boots to character select in 32-bit Lua
        run: bun wisp map boot
        working-directory: ts
      - name: four-fighter p99 <= 10 ms and worst <= 14 ms in Classic
        run: bun wisp perf playable-bot-four --samples --out build/playable-bot-four.perf && bun wisp perf budget build/playable-bot-four.perf
        working-directory: ts
      - name: four-fighter 7-frame rollback p99 <= 10 ms and worst <= 14 ms
        if: ${{ !cancelled() }}
        run: bun wisp perf rollback-four --samples --out build/rollback-four.perf && bun wisp perf budget build/rollback-four.perf
        working-directory: ts
      - name: four fighters on the fixed key tape
        if: ${{ !cancelled() }}
        run: bun wisp perf playable-human-four --samples --out build/playable-human-four.perf
        working-directory: ts
      - name: fixed-tape frame cost within 5% of the previous landed main
        if: ${{ !cancelled() && hashFiles('ts/build/playable-human-four.perf') != '' }}
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for run in $(gh run list --workflow ci.yml --branch main --status completed -L 20 --json databaseId -q '.[].databaseId'); do
            [ "$run" != "$GITHUB_RUN_ID" ] || continue
            rm -rf build/previous
            gh run download "$run" -n main-perf -D build/previous 2>/dev/null && [ -f build/previous/playable-human-four.perf ] && break
          done
          if [ ! -f build/previous/playable-human-four.perf ]; then
            echo "::warning::no earlier main fixed-tape perf artifact; this run's becomes the reference"
            exit 0
          fi
          previous=$(cat build/previous/sha)
          echo "comparing with main $previous"
          bun wisp perf compare build/previous/playable-human-four.perf build/playable-human-four.perf && exit 0
          rises=$(git log --format='%h%x09%(trailers:key=Perf-Rise,valueonly,separator=%x20)' "$previous..HEAD" | awk -F'\t' 'length($2) >= 10')
          if [ -n "$rises" ]; then
            echo "::warning::frame cost rose more than 5% since $previous; accepted by Perf-Rise: trailers"
            { echo "### Perf-Rise accepted since $previous"; echo; printf '%s\n' "$rises" | sed 's/\t/: /; s/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
      - if: ${{ !cancelled() && hashFiles('ts/build/playable-bot-four.perf') != '' }}
        run: mkdir -p build/main-perf && cp build/playable-bot-four.perf build/main-perf/ && { [ ! -f build/playable-human-four.perf ] || cp build/playable-human-four.perf build/main-perf/; } && git rev-parse HEAD > build/main-perf/sha
        working-directory: ts
      - if: ${{ !cancelled() && hashFiles('ts/build/playable-bot-four.perf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: main-perf
          path: ts/build/main-perf
          retention-days: 30
      - if: ${{ !cancelled() }}
        run: bun scripts/commitMetrics.ts build/playable-bot-four.perf build/playable.lua | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ts

  # The rest of the full suite, as Farm test groups on hosted runners (every check of each group, full=1).
  # A group whose inputs match a farm-pass-GROUP-KEY artifact (a landing gate's or an earlier main run's) logs
  # "GROUP reused: it passed before on inputs KEY" and runs nothing. Smoke runs boot, perf and rollback on main.
  farm:
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/farm-test.yml
    with:
      ref: ${{ github.sha }}
      farm-runner: ubuntu-latest
      full: "1"
      checks: ${{ github.ref == 'refs/heads/main' && '["parity-0","parity-1","parity-2","parity-3","lua","corpus","computer-0","computer-1","types","clean-room","static"]' || '["perf","parity-0","parity-1","parity-2","parity-3","lua","corpus","computer-0","computer-1","types","clean-room","static"]' }}

  # New structural debt (import cycle, layer violation, oversize file or function, rising hotspot) against structure.toml (north:harness/code-health).
  code-health:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm i -g @ast-grep/cli@0.42.1
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - run: cargo build --release --locked --bin north && echo "CODE_HEALTH_NORTH_BIN=$PWD/target/release/north" >> "$GITHUB_ENV"
        working-directory: ${{ runner.temp }}/north
      - env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then base=$BEFORE; else base=$(git merge-base origin/main HEAD); fi
          bun "$RUNNER_TEMP/north/harness/code-health/cli.ts" gate "$base" HEAD

  # Autoland dispatches this workflow after a landing, and a dispatched run
  # starts no workflow_run, so it hands its own result to "Main is red".
  main-red:
    needs: [smoke, farm]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
