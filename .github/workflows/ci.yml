name: CI

on:
  pull_request:
  push:
    # Farm scratch branches and claude/ branches run only the workflow that checks them; codex/ review and probe/ balance candidates run none.
    branches-ignore: ["farm/**", "claude/**", "codex/**", "probe/**"]
  # Autoland's pushes to main start no workflows, so it dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

# Lanes land on main every few minutes. One run per ref finishes; a newer push
# replaces only the queued run, so the newest commit is always the next verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Autoland lands only a candidate the farm test (farm-test.yml) passed, which runs
# every check below that its changed paths can affect; its dispatch after a landing
# runs the smoke job and the checks the farm test skips for unrelated changes.
env:
  SWEEP_PLACEMENT: gate

jobs:
  # This commit's p95 frame cost, allocation and map script size on main, in the job summary and log (`grep commit-metrics`).
  smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: four-fighter p99 <= 10 ms and worst <= 14 ms in Classic
        run: bun wisp perf playable-bot-four --samples --out build/playable-bot-four.perf && bun wisp perf budget build/playable-bot-four.perf
        working-directory: ts
      - name: four-fighter 24-frame rollback p99 <= 10 ms and worst <= 14 ms
        if: ${{ !cancelled() }}
        run: bun wisp perf rollback-four --samples --out build/rollback-four.perf && bun wisp perf budget build/rollback-four.perf
        working-directory: ts
      - name: four fighters on the fixed key tape
        if: ${{ !cancelled() }}
        run: bun wisp perf playable-human-four --samples --out build/playable-human-four.perf
        working-directory: ts
      - name: fixed-tape frame cost within 5% of the previous landed main
        if: ${{ !cancelled() && hashFiles('ts/build/playable-human-four.perf') != '' }}
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for run in $(gh run list --workflow ci.yml --branch main --event workflow_dispatch --status completed -L 20 --json databaseId -q '.[].databaseId'); do
            [ "$run" != "$GITHUB_RUN_ID" ] || continue
            rm -rf build/previous
            gh run download "$run" -n main-perf -D build/previous 2>/dev/null && [ -f build/previous/playable-human-four.perf ] && break
          done
          if [ ! -f build/previous/playable-human-four.perf ]; then
            echo "::warning::no earlier main fixed-tape perf artifact; this run's becomes the reference"
            exit 0
          fi
          previous=$(cat build/previous/sha)
          echo "comparing with main $previous"
          bun wisp perf compare build/previous/playable-human-four.perf build/playable-human-four.perf && exit 0
          rises=$(git log --format='%h%x09%(trailers:key=Perf-Rise,valueonly,separator=%x20)' "$previous..HEAD" | awk -F'\t' 'length($2) >= 10')
          if [ -n "$rises" ]; then
            echo "::warning::frame cost rose more than 5% since $previous; accepted by Perf-Rise: trailers"
            { echo "### Perf-Rise accepted since $previous"; echo; printf '%s\n' "$rises" | sed 's/\t/: /; s/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
      - if: ${{ !cancelled() && hashFiles('ts/build/playable-bot-four.perf') != '' }}
        run: mkdir -p build/main-perf && cp build/playable-bot-four.perf build/main-perf/ && { [ ! -f build/playable-human-four.perf ] || cp build/playable-human-four.perf build/main-perf/; } && git rev-parse HEAD > build/main-perf/sha
        working-directory: ts
      - if: ${{ !cancelled() && hashFiles('ts/build/playable-bot-four.perf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: main-perf
          path: ts/build/main-perf
          retention-days: 30
      - if: ${{ !cancelled() }}
        run: bun scripts/commitMetrics.ts build/playable-bot-four.perf build/playable.lua | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ts

  filtered-checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - run: bun wisp parity tapes && bun wisp parity numeric
        working-directory: ts
      - if: ${{ !cancelled() }}
        run: LUA_TESTS_STEP=stack bun scripts/lua-tests.ts
        working-directory: ts
      - if: ${{ !cancelled() }}
        run: COMPILER_TIMINGS=1 bun scripts/compiler-benchmark.ts
        working-directory: ts
      - if: ${{ !cancelled() }}
        run: bun scripts/typecheck-benchmark.ts
        working-directory: ts
        env:
          CI_TIMING: report
      - if: ${{ !cancelled() }}
        run: git clone -q --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north" && bun "$RUNNER_TEMP/north/agent-machinery/scripts/effect-kit.mjs" check

  development-loop:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install stock texture converter
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # No game files or copied game scripts outside the allowlist (wisp:docs/clean-room.md).
      - run: bun scripts/cleanRoom.ts
        working-directory: ts
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - run: bun "$RUNNER_TEMP/north/agent-machinery/scripts/effect-kit.mjs" check
      # Hosted runners for this private repository are smaller than the development
      # machine the timing targets describe; integration gates them on that machine.
      - run: bun scripts/ci.ts
        working-directory: ts
        env:
          CI_TIMING: report
      - name: Report every selectable computer fighter
        if: ${{ !cancelled() }}
        run: bun scripts/cpuCoverage.ts
        working-directory: ts
      # Replay tapes and the numeric corpus in a stock Lua32 and in one whose
      # raw float + - * round toward zero (wisp:docs/headless.md#raw-float-rounding):
      # both must equal Bun, so no raw float operation leaks past the exact helpers.
      - if: ${{ !cancelled() }}
        run: bun wisp parity tapes && bun wisp parity numeric
        working-directory: ts
      # Every native recording in the checked-in corpus replays headless with 0
      # divergent frames, each on the source that recorded it (wisp#69).
      - if: ${{ !cancelled() }}
        run: bun wisp parity corpus test/corpus
        working-directory: ts
      - if: ${{ !cancelled() }}
        run: bun wisp perf playable-bot-four --samples --out build/playable-bot-four.perf
        working-directory: ts
      - name: perf target (#168)
        if: ${{ !cancelled() && hashFiles('ts/build/playable-bot-four.perf') != '' }}
        run: bun wisp perf budget build/playable-bot-four.perf
        working-directory: ts
      # This commit's p95 frame cost, allocation and map script size, in the job summary and log (`grep commit-metrics`).
      - if: ${{ !cancelled() }}
        run: bun scripts/commitMetrics.ts build/playable-bot-four.perf build/playable.lua | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ts

  # New structural debt (import cycle, layer violation, oversize file or function, rising hotspot) against structure.toml (north:harness/code-health).
  code-health:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm i -g @ast-grep/cli@0.42.1
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then base=$BEFORE; else base=$(git merge-base origin/main HEAD); fi
          bun "$RUNNER_TEMP/north/harness/code-health/cli.ts" gate "$base" HEAD

  # Autoland dispatches this workflow after a landing, and a dispatched run
  # starts no workflow_run, so it hands its own result to "Main is red".
  main-red:
    needs: [smoke, filtered-checks, development-loop]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
