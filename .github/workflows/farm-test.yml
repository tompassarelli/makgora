name: Farm test

# The checks main's CI runs, for one commit on free hosted runners, each group
# only when the change can affect it (smashcraft:ts/scripts/landingChecks.ts).
# safe-push's landing gate dispatches it with the groups it selected; `bun wisp
# farm test` dispatches it and prints the summary the merge job uploads.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test
        default: main
      base:
        description: Exact base commit SHA for history attribution, if known
        default: ""
      tag:
        description: Names the run so `bun wisp farm test` can find the one it dispatched
        default: ""
      farm-runner:
        description: One-off runner measurement for even shard jobs; normal and retry jobs use hosted runners
        default: ""
      checks:
        description: JSON array of the check groups to run (safe-push's landing selection), such as ["corpus","static"]; empty runs those the changed paths reach
        default: ""
      full:
        description: Set to 1 to run every check of the selected groups, not only those the changed paths reach (LAND_FULL_SUITE=1)
        default: ""
  # Autoland (autoland.yml) runs the suites for a rebased branch inside its own run.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        default: ""
      tag:
        type: string
        default: ""
      farm-runner:
        type: string
        default: ""
      checks:
        type: string
        default: ""
      full:
        type: string
        default: ""

run-name: Farm test ${{ inputs.ref }} ${{ inputs.tag }}

permissions:
  contents: read
  actions: read

env:
  SWEEP_PLACEMENT: gate
  FARM_GROUPS: perf rollback parity-0 parity-1 parity-2 parity-3 lua corpus computer-0 computer-1 types clean-room static

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      hosted-runner: ${{ steps.plan.outputs.hosted-runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      # Every run saves its measurements under a new key; the newest restores here.
      - uses: actions/cache/restore@v4
        with:
          path: ts/farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      # Check jobs record their time as Lua rows; they run on their own runners, so no shard plans them.
      - id: plan
        working-directory: ts
        env:
          FARM: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.run_attempt == 1 && inputs.farm-runner || '' }}
          BASE: ${{ inputs.base }}
        run: |
          git -c gc.auto=0 fetch -q --depth 1 origin "$GITHUB_SHA"
          HOSTED=$(git show "$GITHUB_SHA:ts/runner-routing.json" | jq -er '.premerge | select(type == "string" and length > 0)')
          echo "hosted-runner=$HOSTED" >> "$GITHUB_OUTPUT"
          pool() { jq -c -n --arg farm "$FARM" --arg hosted "$HOSTED" "[range($1) | if \$farm != \"\" and . % 2 == 0 then \$farm else \$hosted end]"; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f farm-timings.json ]; then
            jq '.lua |= with_entries(select(.key | (startswith("check: ") or startswith("parity corpus: ") or . == "stack-trace profile TypeScript frames") | not))' farm-timings.json > plan-timings.json
          fi
          bun node_modules/wisp/host/farm/farmShards.ts plan --timings plan-timings.json --bun 0 --lua 1 > plan.json
          [ -z "$BASE" ] || [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          jq -n --arg sha "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" --arg base "$BASE" \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 1, sha: $sha, tree: $tree, base: (if $base == "" then null else $base end), runId: $runId, runAttempt: $runAttempt}' > identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: farm-test-plan
          path: |
            ts/plan.json
            ts/identity.json
          retention-days: 3

  # The rest of main's CI, each check a result row of its own; a failing check
  # adds its last output lines to the summary.
  # Checks need no shard plan, so they start beside it on the dispatched ref (Autoland passes an exact SHA).
  # A group runs when the `checks` input names it, or, without one, when a changed path reaches it
  # (smashcraft:ts/scripts/landingChecks.ts). A `checks` input starts only the groups it names, so a landing's gate run takes no hosted runner for the others and queues behind fewer jobs. parity-N replays one quarter of the tapes by measured replay cost and lua runs parity numeric and the stack-trace profile beside them; computer-N checks half of the roster's computer-fighter coverage by `CPU_COVERAGE_SHARD`; static is the clean room, the kind-tag, ledger and type check with the effect-kit check reading its output (one type-check, not two), the cue models and the Autoland suite parity check.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(inputs.checks != '' && inputs.checks || '["perf","rollback","parity-0","parity-1","parity-2","parity-3","lua","corpus","computer-0","computer-1","types","clean-room","static"]') }}
    name: ${{ matrix.group }}
    steps:
      - if: ${{ !contains(fromJson('["corpus","computer-0","computer-1","static"]'), matrix.group) }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - if: ${{ contains(fromJson('["corpus","computer-0","computer-1","static"]'), matrix.group) }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/repos/effect/**
            /repos/effect/package.json
            /repos/effect/LLMS.md
            !/tools/move-data/links/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - id: scope
        env:
          BASE: ${{ inputs.base }}
          CHECKS: ${{ inputs.checks }}
          FULL: ${{ inputs.full }}
          GROUP: ${{ matrix.group }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$BASE
          if [ -z "$base" ]; then
            git -c gc.auto=0 fetch -q --depth 300 origin main "$(git rev-parse HEAD)"
            base=$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)
            [ "$base" != "$(git rev-parse HEAD)" ] || base=
          else
            git -c gc.auto=0 fetch -q --depth 1 --filter=blob:none origin "$base" || base=
          fi
          if [ -n "$base" ] && [ "$FULL" != 1 ]; then git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed"; else echo unknown > "$RUNNER_TEMP/changed"; fi
          sed 's/^/changed: /' "$RUNNER_TEMP/changed"
          if [ -n "$CHECKS" ]; then
            selected=$(jq -r '.[]' <<< "$CHECKS")
            echo "selected by the checks input: $CHECKS"
          else
            selected=$(cd ts && bun scripts/landingChecks.ts groups < "$RUNNER_TEMP/changed")
          fi
          run=false
          ! grep -qxF "$GROUP" <<< "$selected" || run=true
          echo "$GROUP filtered out by the changed paths" > "skipped-check-$GROUP.txt"
          if [ "$run" = true ]; then
            key=$(git ls-tree -r --full-tree HEAD | (cd ts && bun scripts/landingInputs.ts "$GROUP" "$RUNNER_TEMP/changed") 2>/dev/null) || key=
            echo "key=$key" >> "$GITHUB_OUTPUT"
            [ -z "$key" ] || passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=farm-pass-$GROUP-$key&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | length' 2>/dev/null || echo 0)
            if [ "${passed:-0}" -gt 0 ]; then
              run=false
              echo "$GROUP reused: it passed before on inputs $key" > "skipped-check-$GROUP.txt"
              echo "::notice::Autoland reusing $GROUP: passed before on inputs $key"
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-skipped-check-${{ matrix.group }}
          path: skipped-check-${{ matrix.group }}.txt
          retention-days: 3
      # Each group keeps its own Lua32 builds: parity's include the toward-zero variant.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/host/compile/lua32.ts', 'ts/node_modules/wisp/native/*.h') }}-${{ matrix.group }}
          restore-keys: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/host/compile/lua32.ts', 'ts/node_modules/wisp/native/*.h') }}
      - if: steps.scope.outputs.run == 'true'
        name: Run the ${{ matrix.group }} checks
        working-directory: ts
        timeout-minutes: 20
        env:
          GROUP: ${{ matrix.group }}
        # The group's checks and their selection are smashcraft:ts/scripts/landingChecks.ts, which safe-push's landing gate runs on its own machine.
        run: |
          set +e
          bun scripts/landingRun.ts farm "$GROUP" "$RUNNER_TEMP/changed"
          failed=$?
          if [ "$GROUP" = perf ] && [ -f build/playable-bot-four.perf ]; then
            bun scripts/commitMetrics.ts build/playable-bot-four.perf build/playable.lua | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          bun node_modules/wisp/host/farm/farmShards.ts lua --shard 0 --exit-code "$failed" build/checks.tsv > "result-check-$GROUP.json"
          exit "$failed"
      - if: success() && steps.scope.outputs.run == 'true' && steps.scope.outputs.key != ''
        run: echo "${{ matrix.group }} passed on inputs ${{ steps.scope.outputs.key }}" > "$RUNNER_TEMP/farm-pass.txt"
      - if: success() && steps.scope.outputs.run == 'true' && steps.scope.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: farm-pass-${{ matrix.group }}-${{ steps.scope.outputs.key }}
          path: ${{ runner.temp }}/farm-pass.txt
          retention-days: 7
      - if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-result-check-${{ matrix.group }}
          path: |
            ts/result-check-*.json
            ts/problems-*.txt
          retention-days: 3

  # The summary is uploaded whatever happens, so a red run always names its cause:
  # failing tests, each failing check's output, Lua budget overruns and missing shards.
  merge:
    needs: [plan, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/cache/restore@v4
        with:
          path: ts/farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      - uses: actions/download-artifact@v4
        with:
          pattern: farm-test-*
          path: ts/farm
      - name: Merge the results and check the Lua32 instruction and allocation budget
        working-directory: ts
        timeout-minutes: 5
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS: ${{ inputs.checks }}
          LUA_TEST_COST_DIR: farm
        run: |
          set +e
          fallback() { echo "{\"bun\":$1,\"lua\":$1,\"failures\":[],\"problems\":[$2]}" > summary.json; }
          zero='{"passed":0,"failed":0,"skipped":0,"shards":0,"slowestShardSeconds":0}'
          fallback "$zero" '"the merge step did not finish: see its log"'
          : > problems.txt
          for group in $FARM_GROUPS; do
            [ -z "$CHECKS" ] || jq -e --arg group "$group" 'index($group)' <<< "$CHECKS" > /dev/null || continue
            [ -n "$(find farm \( -name "result-check-$group.json" -o -name "skipped-check-$group.txt" \))" ] || echo "check group $group neither ran nor was filtered out: it left no result" >> problems.txt
          done
          [ "$PLAN_RESULT" = success ] || echo "the plan job ended $PLAN_RESULT, so no shard ran: see its log" >> problems.txt
          bun node_modules/wisp/host/farm/farmShards.ts merge --plan farm/farm-test-plan/plan.json --timings farm-timings.json --out summary.json $(find farm -name 'result*.json') 2> merge.log
          merged=$?
          cat merge.log
          if [ "$merged" != 0 ]; then
            fallback "$zero" ""
            echo "merging the shard results failed: $(tail -n 3 merge.log | tr '\n' ' ')" >> problems.txt
          fi
                  find farm -name 'problems-*.txt' -exec sh -c 'for f; do cat "$f"; echo; done' _ {} + >> problems.txt
          jq --rawfile extra problems.txt '.problems = ($extra | split("\n") | map(select(test("\\S")))) + .problems' summary.json > summary.next && mv summary.next summary.json
          cat summary.json
          [ "$merged" = 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-summary
          path: ts/summary.json
          retention-days: 7
      - if: always() && hashFiles('ts/farm-timings.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ts/farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
