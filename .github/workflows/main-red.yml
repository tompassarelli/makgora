name: Main is red

# Each finished CI run on main first goes to the sheriff, which reverts a
# landing that turned a green main red (smashcraft:ts/scripts/sheriff.ts); the
# rest open, update or close the one "main is red" issue
# (smashcraft:ts/scripts/mainRed.ts). Dispatch with a run ID to report
# any branch's run, as "BRANCH is red".
on:
  workflow_run:
    workflows: [CI, Background sweeps]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: CI run ID to report
        required: true

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: main-red-${{ github.event.workflow_run.head_branch || inputs.run }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # CI dispatches its own report while its last job is still running.
      - if: inputs.run != ''
        run: gh run watch "${{ inputs.run }}" -i 60 > /dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - id: sheriff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          bun scripts/sheriff.ts "$REPORT_RUN"
        working-directory: ts
        env:
          REPORT_RUN: ${{ inputs.run || github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # A reverted landing gets no issue: the revert's own CI run reports.
      - if: ${{ !cancelled() && steps.sheriff.outputs.reverted == '' }}
        run: bun scripts/mainRed.ts "$REPORT_RUN"
        working-directory: ts
        env:
          REPORT_RUN: ${{ inputs.run || github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # A failed run the sheriff left alone, with still no green run after 15 minutes, is reverted.
      - if: ${{ !cancelled() && steps.sheriff.outputs.reverted == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_RUN: ${{ inputs.run || github.event.workflow_run.id }}
        run: |
          if [ "$(gh run view "$REPORT_RUN" --json conclusion --jq .conclusion)" = failure ]; then
            gh workflow run revert-red.yml -f run="$REPORT_RUN"
          fi
