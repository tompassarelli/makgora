name: Reports

# A safe-push landing lands without Autoland's reports job, so the whole-roster reports
# are regenerated on main after it and pushed as one "Regenerate reports" commit (smashcraft:docs/ci.md#autoland).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports-main
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - id: inputs
        run: echo "key=$(cd ts && bun scripts/advantageInputs.ts)" >> "$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/move-data/advantage-state.jsonl
            tools/move-data/advantage-state.md
          key: advantage-state-${{ steps.inputs.outputs.key }}
      - if: steps.cached.outputs.cache-hit != 'true'
        run: |
          started=$(date +%s)
          (cd ts && bun scripts/wisp.ts combos --advantage --jobs "$(nproc)") 2>&1 | tail -40
          echo "Regenerated the advantage rows on $(nproc) cores in $(( $(date +%s) - started )) s" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tools/move-data/advantage-state.jsonl
            tools/move-data/advantage-state.md
          key: advantage-state-${{ steps.inputs.outputs.key }}
      - name: Commit and push changed reports
        run: |
          set -euo pipefail
          (cd ts && bun scripts/wisp.ts ledger) > ledger.log 2>&1 || { tail -40 ledger.log; exit 1; }
          reports=(tools/move-data/advantage-state.jsonl tools/move-data/advantage-state.md docs/design/melee-parity.md)
          if git diff --quiet -- "${reports[@]}"; then
            echo "The reports were already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "Changed rows (old → new):"; echo '```diff'; git diff -U0 -- tools/move-data/advantage-state.md | grep -E '^[-+]\|' | head -200 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Regenerate reports for $(git rev-parse --short HEAD)" --trailer "Autoland-Reports: 1" -- "${reports[@]}"
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::warning::main changed the reports since this run started; the next run regenerates them"; exit 0; }
          done
          echo "::warning::main kept moving; the next run regenerates the reports"
