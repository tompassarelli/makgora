name: Premerge

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        required: true
      test-selection-script:
        type: string
        required: true
      cli-command:
        type: string
        default: "bun scripts/wisp.ts"
      selected-tests:
        type: string
        default: "[]"
      determinism-check:
        type: string
        required: true
      farm-runner:
        type: string
        default: ubuntu-latest
      working-directory:
        type: string
        default: ts
      lane-sha:
        type: string
        default: ""
    outputs:
      needs-full:
        value: ${{ jobs.check.outputs.needs-full }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.farm-runner != 'farm-big' && inputs.farm-runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      needs-full: ${{ steps.check.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          clean: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ${{ inputs.working-directory }}
      - id: check
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE: ${{ inputs.base }}
          SCRIPT: ${{ inputs.test-selection-script }}
          DETERMINISM_CHECK: ${{ inputs.determinism-check }}
          WISP_CI_COMMAND: ${{ inputs.cli-command }}
          PREMERGE_TEST_FILES: ${{ inputs.selected-tests }}
        run: |
          set +e
          bun "$SCRIPT" "$BASE"
          code=$?
          if [ "$code" -eq 75 ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Wisp gate inconclusive; the caller must pass the full fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-evidence
          path: |
            ${{ inputs.working-directory }}/build/premerge.json
            ${{ inputs.working-directory }}/build/premerge-stages.jsonl
          retention-days: 30
