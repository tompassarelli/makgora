name: Background sweeps

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Landed main commit to test
        default: ""
      rebaseline:
        description: "Fighter pairs, one per line (such as 'murloc vs rifleman'), whose rise over the prior census is a decided change: this run measures them without judging them and its artifact becomes their baseline"
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'background-sweeps-main' || format('background-sweeps-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SWEEPS: "1"
  SWEEP_PLACEMENT: background

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: route
        run: |
          runner=$(jq -er '.background | select(type == "string" and length > 0)' ts/runner-routing.json)
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
  # The host test suite (ts/test), every sweep outside GATE_SWEEPS (ts/src/game/core/gateSweeps.ts) and the
  # per-pair worst-frame census (#405), at most two jobs at once so it never
  # crowds a landing's gate run. Census shard N plays every CENSUS_SHARDS-th fighter of the
  # roster; the census job judges the joined pairs.
  sweeps:
    needs: routing
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { kind: bun, name: "host tests" }
          - { kind: census, shard: 0, name: "census 0" }
          - { kind: census, shard: 1, name: "census 1" }
          - { kind: census, shard: 2, name: "census 2" }
          - { kind: census, shard: 3, name: "census 3" }
          - { kind: census, shard: 4, name: "census 4" }
          - { kind: census, shard: 5, name: "census 5" }
          - { kind: census, shard: 6, name: "census 6" }
    name: ${{ matrix.name }}
    env:
      CENSUS_SHARDS: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - if: matrix.kind != 'bun'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/host/compile/lua32.ts', 'ts/node_modules/wisp/native/*.h') }}
      - if: matrix.kind == 'bun'
        run: bun run test
        working-directory: ts
        timeout-minutes: 25
        env:
          SWEEPS: ""
          TEST_JUNIT_DIR: build/sweep-listing
      - if: matrix.kind == 'lua'
        run: mkdir -p ts/build/sweep-listing
      - if: matrix.kind == 'lua'
        run: bun scripts/lua-tests.ts
        working-directory: ts
        env:
          LUA_JOBS: "4"
          LUA_PARTITION: ${{ matrix.part }}/3
          LUA_TEST_COST_DIR: build/sweep-listing
      - if: ${{ !cancelled() && matrix.kind != 'census' }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-listing-${{ matrix.kind }}-${{ matrix.part }}
          path: ts/build/sweep-listing
          retention-days: 3
      - if: matrix.kind == 'census'
        name: Census shard ${{ matrix.shard }}
        working-directory: ts
        timeout-minutes: 25
        run: |
          mkdir -p census-out
          fighters=$(bun -e 'import { SELECTABLE_CHARACTERS, fighterSlug } from "./src/game/roster/kits"; console.log(SELECTABLE_CHARACTERS.map(fighterSlug).join("\n"))' | awk -v n="$CENSUS_SHARDS" -v s="${{ matrix.shard }}" '(NR - 1) % n == s { printf " --fighter %s", $0 }')
          bun wisp perf census $fighters --jobs 4 --pairs "census-out/census-pairs-${{ matrix.shard }}.txt"
      - if: ${{ !cancelled() && matrix.kind == 'census' }}
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ matrix.shard }}
          path: ts/census-out
          retention-days: 3

  census:
    needs: [routing, sweeps]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 10
    name: Background census
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/download-artifact@v4
        with:
          pattern: census-[0-9]*
          path: ts/census
      # Pairs compare only within one instrument: the Lua32 build and the profiler that measured them.
      - id: instrument
        run: echo "key=taps-land-${{ hashFiles('ts/node_modules/wisp/host/compile/lua32.ts', 'ts/node_modules/wisp/native/*.h', 'ts/node_modules/wisp/src/headless/luaPerf.ts') }}" >> "$GITHUB_OUTPUT"
      - name: Fetch main's last green Background census pairs
        working-directory: ts
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          INSTRUMENT: ${{ steps.instrument.outputs.key }}
        run: |
          git -c gc.auto=0 fetch -q --depth 60 origin main
          for commit in $(git rev-list --first-parent -n 60 FETCH_HEAD); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=census-pairs-$INSTRUMENT-$commit&per_page=100" --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main") | [.id, .workflow_run.id] | @tsv' > prior-artifacts.tsv
            while read -r artifact run; do
              [ "$run" != "$GITHUB_RUN_ID" ] || continue
              green=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion == "success" and .path == ".github/workflows/background-sweeps.yml"')
              [ "$green" = true ] || continue
              mkdir -p prior
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > prior/pairs.zip
              unzip -q -o prior/pairs.zip -d prior
              test -s prior/census-pairs.txt
              echo "Census rise check against main $commit (Background run $run, artifact $artifact)"
              exit 0
            done < prior-artifacts.tsv
          done
          echo "::warning::No green Background census artifact from this instrument on main's last 60 first-parent commits: only coverage and absolute frame budgets apply"
      - name: Every fighter pair's worst frame within the margin of main's last green census (#405)
        working-directory: ts
        env:
          REBASELINE: ${{ inputs.rebaseline }}
        run: |
          cat census/census-*/census-pairs-*.txt > census-pairs.txt 2>/dev/null
          measured=$(wc -l < census-pairs.txt)
          expected=$(bun -e 'import { SELECTABLE_CHARACTERS } from "./src/game/roster/kits"; console.log(SELECTABLE_CHARACTERS.length)')
          [ "$measured" = "$expected" ] || { echo "::error title=Unmeasured::the census measured $measured of $expected fighter pairs: see the census jobs"; exit 1; }
          if [ -f prior/census-pairs.txt ]; then
            judged() { awk -F'\t' -v list="$REBASELINE" 'BEGIN { n = split(list, names, "\n"); for (i = 1; i <= n; i++) skip[names[i]] = 1 } !($2 in skip)' "$1"; }
            judged prior/census-pairs.txt > prior-judged.txt
            judged census-pairs.txt > census-judged.txt
            bun wisp perf compare prior-judged.txt census-judged.txt
          fi
      - if: success() && needs.sweeps.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: census-pairs-${{ steps.instrument.outputs.key }}-${{ inputs.ref || github.sha }}
          path: ts/census-pairs.txt
          overwrite: true
          retention-days: 30

  main-red:
    needs: [sweeps, census]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

  status:
    needs: [sweeps, census]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context="Background sweeps" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Approved background breadth: $STATE"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref || github.sha }}
          STATE: ${{ needs.sweeps.result == 'success' && needs.census.result == 'success' && 'success' || 'failure' }}
