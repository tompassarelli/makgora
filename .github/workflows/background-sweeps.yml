name: Background sweeps

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Landed main commit to test
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'background-sweeps-main' || format('background-sweeps-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SWEEPS: "1"
  SWEEP_PLACEMENT: background

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: route
        run: |
          runner=$(jq -er '.background | select(type == "string" and length > 0)' ts/runner-routing.json)
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
  # Every sweep outside GATE_SWEEPS (ts/src/runtime/gateSweeps.ts) and the
  # per-pair worst-frame census (#405), at most three jobs at once so it never
  # crowds Autoland. Census shard N plays every CENSUS_SHARDS-th fighter of the
  # fixture; the census job judges the joined pairs.
  sweeps:
    needs: routing
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { kind: lua, part: 0, name: "Background sweeps (lua32 0/3)" }
          - { kind: lua, part: 1, name: "Background sweeps (lua32 1/3)" }
          - { kind: lua, part: 2, name: "Background sweeps (lua32 2/3)" }
          - { kind: bun, part: 0, name: "Background sweeps (bun)" }
          - { kind: census, shard: 0, name: "census 0" }
          - { kind: census, shard: 1, name: "census 1" }
          - { kind: census, shard: 2, name: "census 2" }
          - { kind: census, shard: 3, name: "census 3" }
          - { kind: census, shard: 4, name: "census 4" }
          - { kind: census, shard: 5, name: "census 5" }
          - { kind: census, shard: 6, name: "census 6" }
    name: ${{ matrix.name }}
    env:
      CENSUS_SHARDS: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - if: matrix.kind != 'bun'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/scripts/wisp/lua32.ts', 'ts/node_modules/wisp/native/toward-zero.h') }}
      - if: matrix.kind == 'bun'
        run: bun run test
        working-directory: ts
        env:
          TEST_JUNIT_DIR: build/sweep-listing
      - if: matrix.kind == 'lua'
        run: mkdir -p ts/build/sweep-listing
      - if: matrix.kind == 'lua'
        run: bun scripts/lua-tests.ts
        working-directory: ts
        env:
          LUA_JOBS: "4"
          LUA_PARTITION: ${{ matrix.part }}/3
          LUA_TEST_COST_DIR: build/sweep-listing
      - if: ${{ !cancelled() && matrix.kind != 'census' }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-listing-${{ matrix.kind }}-${{ matrix.part }}
          path: ts/build/sweep-listing
          retention-days: 3
      - if: matrix.kind == 'census'
        name: Census shard ${{ matrix.shard }}
        working-directory: ts
        timeout-minutes: 25
        run: |
          mkdir -p census-out
          fighters=$(cut -f2 test/fixtures/perf/census-pairs.txt | sed 's/ vs .*//' | awk -v n="$CENSUS_SHARDS" -v s="${{ matrix.shard }}" '(NR - 1) % n == s { printf " --fighter %s", $0 }')
          bun wisp perf census $fighters --jobs 4 --pairs "census-out/census-pairs-${{ matrix.shard }}.txt"
      - if: ${{ !cancelled() && matrix.kind == 'census' }}
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ matrix.shard }}
          path: ts/census-out
          retention-days: 3

  census:
    needs: [routing, sweeps]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 10
    name: Background census
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/download-artifact@v4
        with:
          pattern: census-*
          path: ts/census
      - name: Every fighter pair's worst frame within the margin of main's fixture (#405)
        working-directory: ts
        run: |
          cat census/census-*/census-pairs-*.txt > census-pairs.txt 2>/dev/null
          measured=$(wc -l < census-pairs.txt) expected=$(wc -l < test/fixtures/perf/census-pairs.txt)
          [ "$measured" = "$expected" ] || { echo "::error title=Unmeasured::the census measured $measured of $expected fighter pairs: see the census jobs"; exit 1; }
          bun wisp perf compare test/fixtures/perf/census-pairs.txt census-pairs.txt

  main-red:
    needs: [sweeps, census]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

  status:
    needs: [sweeps, census]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context="Background sweeps" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Approved background breadth: $STATE"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref || github.sha }}
          STATE: ${{ needs.sweeps.result == 'success' && needs.census.result == 'success' && 'success' || 'failure' }}
