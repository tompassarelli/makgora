name: Background sweeps

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Landed main commit to test
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'background-sweeps-main' || format('background-sweeps-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SWEEPS: "1"
  SWEEP_PLACEMENT: background

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: route
        run: |
          runner=$(jq -er '.background | select(type == "string" and length > 0)' ts/runner-routing.json)
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
  sweeps:
    needs: routing
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: [bun, lua32]
    name: Background sweeps (${{ matrix.runtime }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - if: matrix.runtime == 'lua32'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/scripts/wisp/lua32.ts', 'ts/node_modules/wisp/native/toward-zero.h') }}
      - if: matrix.runtime == 'bun'
        run: bun run test
        working-directory: ts
      - if: matrix.runtime == 'lua32'
        run: bun scripts/lua-tests.ts
        working-directory: ts
        env:
          LUA_JOBS: "4"

  # Per-pair worst-frame census (#405), sharded by fighter: shard N plays every
  # CENSUS_SHARDS-th fighter of the fixture; the census job judges the joined pairs.
  census-shard:
    needs: routing
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    name: census ${{ matrix.shard }}
    env:
      CENSUS_SHARDS: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/scripts/wisp/lua32.ts', 'ts/node_modules/wisp/native/toward-zero.h') }}
      # --rise-ms 1000 leaves the census spike check ungated.
      - name: Census shard ${{ matrix.shard }}
        working-directory: ts
        timeout-minutes: 12
        run: |
          mkdir -p census-out
          fighters=$(cut -f2 test/fixtures/perf/census-pairs.txt | sed 's/ vs .*//' | awk -v n="$CENSUS_SHARDS" -v s="${{ matrix.shard }}" '(NR - 1) % n == s { printf " --fighter %s", $0 }')
          bun wisp perf census $fighters --jobs 4 --rise-ms 1000 --pairs "census-out/census-pairs-${{ matrix.shard }}.txt"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ matrix.shard }}
          path: ts/census-out
          retention-days: 3

  census:
    needs: [routing, census-shard]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.routing.outputs.runner }}
    timeout-minutes: 10
    name: Background census
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/download-artifact@v4
        with:
          pattern: census-*
          path: ts/census
      - name: Every fighter pair's worst frame within the margin of main's fixture (#405)
        working-directory: ts
        run: |
          cat census/census-*/census-pairs-*.txt > census-pairs.txt 2>/dev/null
          measured=$(wc -l < census-pairs.txt) expected=$(wc -l < test/fixtures/perf/census-pairs.txt)
          [ "$measured" = "$expected" ] || { echo "::error::the census measured $measured of $expected fighter pairs: see the census jobs"; exit 1; }
          bun wisp perf compare test/fixtures/perf/census-pairs.txt census-pairs.txt

  main-red:
    needs: [sweeps, census]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

  status:
    needs: [sweeps, census]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context="Background sweeps" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Approved background breadth: $STATE"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref || github.sha }}
          STATE: ${{ needs.sweeps.result == 'success' && needs.census.result == 'success' && 'success' || 'failure' }}
