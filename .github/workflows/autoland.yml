name: Autoland

# Main's one landing queue (smashcraft:docs/ci.md#autoland); ts/scripts/autolandCore.ts decides, this file applies.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: claude/ branches to test again, space-separated, even after a failure; empty plans every waiting branch
        default: ""
      test:
        description: "Set by Autoland: BRANCH SHA to test alone on main"
        default: ""
      slot:
        description: "Set by Autoland: the test slot"
        default: "0"
      train:
        description: "Set by Autoland: land the tips that passed alone"
        default: ""
      farm-runner:
        description: One-off runner label for the suite's even shard jobs, for injecting a stall (smashcraft#513)
        default: ""

run-name: ${{ github.event_name == 'push' && format('Autoland {0} (push)', github.ref_name) || inputs.test && format('Autoland test {0} {1}', inputs.slot, inputs.test) || inputs.train && 'Autoland train' || inputs.branch && format('Autoland plan {0}', inputs.branch) || 'Autoland plan' }}

permissions:
  contents: write
  issues: write
  actions: write
  statuses: write

# Three test slots and one train; plan starts a test only while Autoland's hosted jobs stay within JOB_BUDGET of the account's 40 (ts/scripts/autolandCore.ts).
concurrency:
  group: ${{ github.event_name == 'push' && format('autoland-push-{0}', github.ref) || inputs.test && format('autoland-test-{0}', inputs.slot) || inputs.train && 'autoland-train' || 'autoland-plan' }}
  cancel-in-progress: false
  queue: max

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TEST: ${{ inputs.test }}
  TRAIN: ${{ inputs.train }}
  LOCAL_REFRESH: |
    hand_back_record() {
      grep -Fq 'Classic effect record is missing or stale' <<< "$1" || return 1
      for tip in "${tips[@]}"; do status "$tip" error 'local refresh required: Classic effect record'; done
      echo "Classic effect record needs the local waiter's refresh; source lanes remain for repair and requeue." >> "$GITHUB_STEP_SUMMARY"
    }
  PASSED: |
    passed() {
      local tip="$1" pbase="$2" ptree="$3" before="$4" after="$5" dir="$RUNNER_TEMP/passed-$1" verdict=retest
      git merge-base --is-ancestor "$pbase" "$before" && git worktree add -q --detach "$dir" "$tip" || { echo retest; return; }
      if git -C "$dir" merge-base --is-ancestor "$pbase" HEAD || git -C "$dir" rebase -q "$pbase" > /dev/null 2>&1; then
        mkdir -p "$RUNNER_TEMP/trees"; rm -f "$RUNNER_TEMP"/trees/*
        git ls-tree -r -z "$pbase" > "$RUNNER_TEMP/trees/base"; git ls-tree -r -z "$ptree" > "$RUNNER_TEMP/trees/tested"; git ls-tree -r -z "$after" > "$RUNNER_TEMP/trees/landed"
        mains=()
        for commit in $(git rev-list --reverse --first-parent "$pbase..$before"); do git ls-tree -r -z "$commit" > "$RUNNER_TEMP/trees/$commit"; mains+=("$RUNNER_TEMP/trees/$commit"); done
        actual=$(git -C "$dir" rev-parse 'HEAD^{tree}')
        echo "$actual" > "$RUNNER_TEMP/trees/actual"
        if [ -n "${6:-}" ]; then
          verdict=$(bun "$late_cli" late "$6" "$actual" "$RUNNER_TEMP/trees/base" "$RUNNER_TEMP/trees/tested" "${mains[@]}" --rebased "$RUNNER_TEMP/trees/landed" --lanes lanes.json --retry "$7" || echo retest)
        elif [ "$actual" = "$ptree" ]; then
          verdict=$(bun ts/scripts/autoland.ts past-main "$RUNNER_TEMP/trees/base" "$RUNNER_TEMP/trees/tested" "${mains[@]}" --rebased "$RUNNER_TEMP/trees/landed" || echo retest)
        fi
      else
        git -C "$dir" rebase --abort > /dev/null 2>&1
      fi
      git worktree remove --force "$dir"
      echo "$verdict"
    }
  REPORTS_RUN: |
    install_reports() { (cd ts && bun install --frozen-lockfile); }
    regenerate_reports() {
      set -euo pipefail
      out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
      reports=(tools/move-data/advantage-state.jsonl tools/move-data/advantage-state.md)
      started=$(date +%s)
      if [ "${REPORTS_CACHED:-}" = true ]; then
        echo "Restored ${reports[*]} from the cache for inputs ${REPORTS_KEY:0:12}" >> "$GITHUB_STEP_SUMMARY"
      elif [ -n "${REPORTS_ROWS:-}" ] && [ -d "$REPORTS_ROWS" ]; then
        merge=()
        for rows in "$PWD/$REPORTS_ROWS"/*.jsonl; do merge+=(--merge "$rows"); done
        (cd ts && bun scripts/wisp.ts combos --advantage "${merge[@]}") 2>&1 | tail -40 | tee reports.log
        echo "Merged ${reports[*]} from $(( ${#merge[@]} / 2 )) measured shards in $(( $(date +%s) - started )) s" >> "$GITHUB_STEP_SUMMARY"
      else
        (cd ts && bun scripts/wisp.ts combos --advantage --jobs "$(( $(nproc) < 26 ? $(nproc) : 26 ))") 2>&1 | tail -40 | tee reports.log
        echo "Regenerated ${reports[*]} on $(nproc) cores in $(( $(date +%s) - started )) s" >> "$GITHUB_STEP_SUMMARY"
      fi
      if (cd ts && bun test test/advantage-state.test.ts) > targets.log 2>&1; then
        out verdict "$VERDICT"
      else
        cat targets.log
        out verdict targets
        { echo "detail<<AUTOLAND_EOF"; tail -30 targets.log; echo "AUTOLAND_EOF"; } >> "$GITHUB_OUTPUT"
      fi
      if git diff --quiet -- "${reports[@]}"; then
        echo "The reports were already current." >> "$GITHUB_STEP_SUMMARY"
        out sha "$(git rev-parse HEAD)"
        return 0
      fi
      { echo "Changed rows (old → new):"; echo '```diff'; git diff -U0 -- tools/move-data/advantage-state.md | grep -E '^[-+]\|' | head -200 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      git config user.name "github-actions[bot]"
      git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
      git commit -q -m "Regenerate reports for $(echo $BRANCHES)" --trailer "Autoland-Reports: 1" -- "${reports[@]}"
      [ -z "$SCRATCH" ] || git push -q origin "HEAD:refs/heads/$SCRATCH"
      out sha "$(git rev-parse HEAD)"
    }
  LANES_QUERY: >-
    query($owner: String!, $name: String!, $endCursor: String) { repository(owner: $owner, name: $name) {
    refs(refPrefix: "refs/heads/claude/", first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor }
    nodes { name target { oid ... on Commit { message status { context(name: "autoland") { state description createdAt } } } } } } } }
  LANES_JQ: >-
    .data.repository.refs.nodes[] | {issues: ([.target.message |
    scan("(?:^|[^A-Za-z0-9_/#-])(?:" + env.GH_REPO + "|" + (env.GH_REPO | split("/")[1]) + ")?#([0-9]+)|https://github.com/" + env.GH_REPO + "/issues/([0-9]+)")
    | .[] | select(. != null and . != "") | tonumber] | unique), branch: ("claude/" + .name), tip: .target.oid,
    status: (.target.status.context | if . == null then null else {state: (.state | ascii_downcase), description, at: .createdAt} end)}
  FLAG_CONFLICT: |
    flag() {
      local branch="$1" tip="$2" text="$3" marker="<!-- autoland-conflict $2 ${4:-resolved} -->" lane="<!-- autoland-conflict-lane $1 $2 -->" issue alarm
      for issue in $(git log --format=%B "$base..$tip" | grep -oiE '\b(refs|fixes|closes)[: ]+((tompassarelli/)?smashcraft)?#[0-9]+' | grep -oE '[0-9]+$' | sort -un); do
        gh api "repos/$GH_REPO/issues/$issue/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$marker" && continue
        gh issue comment "$issue" --body "Autoland: \`$branch\` (${tip:0:10}) $text ($RUN_URL)
    $marker" > /dev/null || echo "::warning::couldn't comment on #$issue"
      done
      [ "${4:-}" = alarm ] || return 0
      alarm=$(gh issue list --state open --search 'in:title "Autoland stalled"' --json number,title --jq '[.[] | select(.title == "Autoland stalled")][0].number // empty')
      if [ -z "$alarm" ]; then
        gh issue create --title "Autoland stalled" --body "\`$branch\` (${tip:0:10}) $text ($RUN_URL) (smashcraft#513). This alarm stays open until the lane is pushed again, lands or is deleted.
    $lane" > /dev/null
      else
        gh api "repos/$GH_REPO/issues/$alarm/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$lane" && return 0
        gh issue comment "$alarm" --body "\`$branch\` (${tip:0:10}) $text ($RUN_URL)
    $lane" > /dev/null
      fi || echo "::warning::couldn't raise the Autoland stalled alarm"
    }
  FETCH_LANES: |
    gh api graphql --paginate -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -f query="$LANES_QUERY" --jq "$LANES_JQ" | jq -s . > lane-refs.json
    jq -r '.[] | select(.status.state == "pending") | .tip' lane-refs.json | while read -r tip; do
      gh api "repos/$GH_REPO/commits/$tip/statuses?per_page=100" --jq "{\"$tip\": ([.[] | select(.context == \"autoland\") | .created_at] | min)}" || echo '{}'
    done | jq -s 'add // {}' > since.json
    jq --slurpfile since since.json 'map(. + ($since[0][.tip] // null | if . == null then {} else {since: .} end))' lane-refs.json > lane-since.json && mv lane-since.json lane-refs.json
    fields=$(jq -r '[.[].issues[]] | unique | map("i\(.): issue(number: \(.)) { labels(first: 100) { nodes { name } } milestone { title } }") | join(" ")' lane-refs.json)
    if [ -z "$fields" ]; then
      jq 'map(del(.issues) + {labels: [], milestones: []})' lane-refs.json
    else
      if ! gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -f query="query(\$owner: String!, \$name: String!) { repository(owner: \$owner, name: \$name) { $fields } }" > issue-labels.json; then
        echo "Issue labels could not all resolve; unresolved lanes keep FIFO." >&2
      fi
      if jq -e 'type == "object" and (.data.repository | type == "object")' issue-labels.json > /dev/null 2>&1; then
        jq --slurpfile lanes lane-refs.json '.data.repository as $issues | $lanes[0] | map(. + {labels: ([.issues[] as $number | $issues["i" + ($number | tostring)].labels.nodes[]?.name] | unique), milestones: ([.issues[] as $number | $issues["i" + ($number | tostring)].milestone.title // empty] | unique)} | del(.issues))' issue-labels.json
      else
        jq 'map(del(.issues) + {labels: [], milestones: []})' lane-refs.json
      fi
    fi

jobs:
  # The `autoland` status on a branch tip is the queue: pending "queued", "waiting to test alone",
  # "testing alone on MAIN" or "passed alone on MAIN as tree TREE", then success "landed as SHA"
  # or failure. `safe-push --to main` waits on it. A push runs the branch's copy of this file.
  queue:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          gh api "repos/$GH_REPO/statuses/$GITHUB_SHA" -f state=pending -f context=autoland -f description=queued -f target_url="$RUN_URL" > /dev/null
          gh workflow run autoland.yml --ref main

  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.test != '' || inputs.train != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      premerge-runner: ${{ steps.build.outputs.premerge-runner }}
      verdict: ${{ steps.build.outputs.verdict }}
      sha: ${{ steps.build.outputs.sha }}
      tree: ${{ steps.build.outputs.tree }}
      base: ${{ steps.build.outputs.base }}
      scratch: ${{ steps.build.outputs.scratch }}
      branches: ${{ steps.build.outputs.branches }}
      tips: ${{ steps.build.outputs.tips }}
      detail: ${{ steps.build.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # verdict: test (needs the suite), tested (up to 2 train lanes, each its passed-alone tree past main commits that miss its paths), check (the pre-push gate failed) or none.
      - id: build
        run: |
          set +e -uo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          status() { gh api "repos/$GH_REPO/statuses/$1" -f state="$2" -f context=autoland -f description="${3:0:139}" -f target_url="$RUN_URL" > /dev/null; }
          refuse() {
            local branch="$1" tip="$2"
            status "$tip" failure "$3"
            { echo "Autoland didn't land \`$branch\` (${tip:0:10}): $3"; echo; printf '%s\n' "$4" | head -60
              echo; echo "The branch stays; push a fix to it and it tries again."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Autoland didn't land::$branch (${tip:0:10}): $3"
          }
          eval "$FLAG_CONFLICT"
          eval "$PASSED"
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .githooks
          git fetch -q origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          premerge=$(jq -er '.premerge | select(type == "string" and length > 0)' ts/runner-routing.json) || exit 1
          out premerge-runner "$premerge"
          base=$(git rev-parse origin/main)
          out base "$base"
          if [ -n "$TEST" ]; then
            read -r branch tip <<< "$TEST"
            current=$(gh api "repos/$GH_REPO/commits/$tip/status" --jq '([.statuses[] | select(.context == "autoland")][0] // {}) | "\(.state // ""):\(.description // "")"')
            if [ "$(git rev-parse -q --verify "refs/remotes/origin/$branch")" != "$tip" ] || [ "${current%%:*}" != pending ] || [[ "${current#*:}" == "passed alone on "* ]]; then
              echo "\`$branch\` no longer waits at ${tip:0:10} (${current:-no status}): nothing to test" >> "$GITHUB_STEP_SUMMARY"
              out verdict none; exit 0
            fi
            printf '%s\t%s\t\t\n' "$branch" "$tip" > lanes.tsv
          else
            bash -euo pipefail -c "$FETCH_LANES" > lanes.json
            bun ts/scripts/autoland.ts train --lanes lanes.json > lanes.tsv
          fi
          git checkout -q -B autoland "$base"
          branches=""; tips=""; count=0; tested=""; directs=""
          while IFS=$'\t' read -r -u 3 branch tip passed_base passed_tree; do
            if [ -z "$(git rev-list "$base..$tip")" ]; then
              git push -q --force-with-lease="refs/heads/$branch:$tip" origin ":refs/heads/$branch"
              status "$tip" success "landed as $base"
              echo "main already holds $branch: deleted it" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            workflows=$(git diff --name-only "$(git merge-base "$base" "$tip")" "$tip" -- .github/workflows)
            if [ -n "$workflows" ]; then
              refuse "$branch" "$tip" "it changes .github/workflows, which the workflow token can't push; land it with safe-push" "$workflows"
              flag "$branch" "$tip" "lane failed: it changes .github/workflows; land it with safe-push." failed
              continue
            fi
            lane_base=$(git rev-parse autoland)
            git checkout -q --detach "$tip"
            if ! git merge-base --is-ancestor autoland HEAD && ! git rebase -q autoland > rebase.log 2>&1; then
              conflicted=""; resolved=""; why="the rebase stopped without a file conflict"
              for _ in $(seq 20); do
                files=$(git diff --name-only --diff-filter=U)
                [ -n "$files" ] || break
                conflicted="$conflicted $files"
                for file in $files; do
                  jq -n --arg path "$file" --arg base "$(git show ":1:$file" 2>/dev/null)" --arg ours "$(git show ":2:$file" 2>/dev/null)" --arg theirs "$(git show ":3:$file" 2>/dev/null)" '$ARGS.named'
                done | jq -s . > conflicts.json
                IFS=$'\t' read -r action note reports <<< "$(bun ts/scripts/autoland.ts resolve --conflicts conflicts.json || printf 'flag\tresolving failed')"
                if [ "$action" != resolve ]; then why="$note"; break; fi
                for report in $reports; do git checkout -q --ours -- "$report"; done
                git add -- $files
                resolved="$resolved${resolved:+; }$note"
                if GIT_EDITOR=true git rebase --continue >> rebase.log 2>&1; then why=""; break; fi
              done
              files=$(echo $conflicted)
              if [ -n "$why" ]; then
                git rebase --abort
                git checkout -q autoland
                refuse "$branch" "$tip" "rebasing onto main and the branches ahead of it conflicts in $files" "${files:-$(tail -20 rebase.log)}"
                flag "$branch" "$tip" "conflicts in \`$files\` when rebased onto main ${base:0:10}. Not auto-resolved: $why. Push a rebased fix to the branch." alarm
                continue
              fi
              echo "Auto-resolved generated conflicts of \`$branch\`: $resolved" >> "$GITHUB_STEP_SUMMARY"
              flag "$branch" "$tip" "conflicted in generated \`$files\` when rebased onto main ${base:0:10}; Autoland auto-resolved it ($resolved) and continues with the lane."
            fi
            direct=retest
            [ -z "$passed_tree" ] || direct=$(passed "$tip" "$passed_base" "$passed_tree" autoland HEAD)
            directs="$directs $direct"
            step=$(bun ts/scripts/autoland.ts train-step $directs)
            if [ "$step" = drop ]; then
              git checkout -q autoland
              echo "\`$branch\` changes paths main moved on since it passed alone: it waits for the next train" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            git checkout -q -B autoland
            lane_count=$(git rev-list --count --first-parent "$lane_base..HEAD")
            if [ "$lane_count" -gt 0 ]; then
              git log --format=%B "$lane_base..HEAD" > lane-messages.txt
              issues=$(bun ts/scripts/autoland.ts refs --messages lane-messages.txt | jq -s .) || exit 1
              lane=$(jq -cn --arg branch "$branch" --argjson count "$lane_count" --argjson issues "$issues" '{branch: $branch, count: $count, issues: $issues}') || exit 1
              git commit --amend -q --no-edit --trailer "Autoland-Lane: $lane" || exit 1
            fi
            branches="$branches $branch"; tips="$tips $tip"; count=$((count + 1))
            [ "$step" = suite ] || tested=1
            [ "$step" != last ] || break
          done 3< lanes.tsv
          out branches "${branches# }"
          out tips "${tips# }"
          if [ -z "$branches" ]; then out verdict none; exit 0; fi
          sha=$(git rev-parse HEAD)
          scratch="farm/autoland-${sha:0:12}"
          out sha "$sha"
          out tree "$(git rev-parse 'HEAD^{tree}')"
          [ -z "$TEST" ] || status "${tips# }" pending "testing alone on ${base:0:10}"
          echo "${TEST:+Testing alone: }${TRAIN:+Train: }candidate ${sha:0:10} on main ${base:0:10}:$(printf ' `%s`' $branches)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$tested" ]; then
            git push -q --no-verify origin "HEAD:refs/heads/$scratch" || exit 1
            echo "Each lane is the tree it passed alone, past main commits that miss its paths: the train lands without another suite." >> "$GITHUB_STEP_SUMMARY"
            out scratch "$scratch"
            out verdict tested
            exit 0
          fi
          # A branch may move ts/bun.lock (the Wisp pin): check against the candidate's own install.
          if ! (cd ts && bun install --frozen-lockfile) > push.log 2>&1 \
              || ! git push origin "HEAD:refs/heads/$scratch" >> push.log 2>&1; then
            cat push.log
            out verdict check
            { echo "detail<<AUTOLAND_EOF"; grep -v '^remote:' push.log | tail -40; echo "AUTOLAND_EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out scratch "$scratch"
          out verdict test

  # Lanes never regenerate whole-roster reports: the candidate's are rebuilt here beside its suite and land with it as one more commit.
  reports-shard:
    needs: build
    if: needs.build.outputs.verdict == 'test' || needs.build.outputs.verdict == 'tested'
    runs-on: ${{ needs.build.outputs.premerge-runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2]
    name: reports shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Run bun install --frozen-lockfile
        run: |
          eval "$REPORTS_RUN"
          install_reports
      - id: inputs
        run: |
          key=$(cd ts && bun scripts/advantageInputs.ts)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: |
            tools/move-data/advantage-state.jsonl
            tools/move-data/advantage-state.md
          key: advantage-state-${{ steps.inputs.outputs.key }}
      - if: steps.cached.outputs.cache-hit != 'true'
        run: |
          started=$(date +%s)
          (cd ts && bun scripts/wisp.ts combos --advantage --shard ${{ matrix.shard }}/3 --rows "$PWD/../advantage-rows-${{ matrix.shard }}.jsonl" --jobs "$(nproc)") 2>&1 | tail -40
          echo "Measured shard ${{ matrix.shard }}/3 of the advantage rows on $(nproc) cores in $(( $(date +%s) - started )) s" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: advantage-rows-${{ matrix.shard }}
          path: advantage-rows-${{ matrix.shard }}.jsonl
          retention-days: 1
          if-no-files-found: error

  reports:
    needs: build
    if: needs.build.outputs.verdict == 'test' || needs.build.outputs.verdict == 'tested'
    runs-on: ${{ needs.build.outputs.premerge-runner }}
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.reports.outputs.verdict }}
      sha: ${{ steps.reports.outputs.sha }}
      detail: ${{ steps.reports.outputs.detail }}
    env:
      VERDICT: ${{ needs.build.outputs.verdict }}
      SCRATCH: ${{ needs.build.outputs.scratch }}
      BRANCHES: ${{ needs.build.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Run bun install --frozen-lockfile
        run: |
          eval "$REPORTS_RUN"
          install_reports
      - id: inputs
        run: |
          key=$(cd ts && bun scripts/advantageInputs.ts)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/move-data/advantage-state.jsonl
            tools/move-data/advantage-state.md
          key: advantage-state-${{ steps.inputs.outputs.key }}
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Measure shard 0/3 and collect shards 1 and 2
        run: |
          started=$(date +%s)
          mkdir -p advantage-rows
          measure() { (cd ts && bun scripts/wisp.ts combos --advantage --shard "$1/3" --rows "$PWD/../advantage-rows/advantage-rows-$1.jsonl" --jobs "$(nproc)") 2>&1 | tail -40; }
          measure 0
          for shard in 1 2; do
            while :; do
              url=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=advantage-rows-$shard" --jq '.artifacts[0].archive_download_url // ""' || true)
              if [ -n "$url" ] && gh api "$url" > "$RUNNER_TEMP/rows.zip" && unzip -o -q "$RUNNER_TEMP/rows.zip" -d advantage-rows; then break; fi
              ended=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq "[.jobs[] | select(.name == \"reports shard $shard\" and .status == \"completed\")] | length" || echo 0)
              if [ "$ended" != 0 ] && [ -z "$url" ]; then echo "Shard $shard ended without rows; measuring it here"; measure "$shard"; break; fi
              sleep 5
            done
          done
          echo "Measured and collected the three advantage shards in $(( $(date +%s) - started )) s" >> "$GITHUB_STEP_SUMMARY"
      - id: reports
        name: Run set -euo pipefail
        env:
          REPORTS_CACHED: ${{ steps.cached.outputs.cache-hit }}
          REPORTS_ROWS: ${{ steps.cached.outputs.cache-hit != 'true' && 'advantage-rows' || '' }}
          REPORTS_KEY: ${{ steps.inputs.outputs.key }}
        run: |
          eval "$REPORTS_RUN"
          regenerate_reports
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tools/move-data/advantage-state.jsonl
            tools/move-data/advantage-state.md
          key: advantage-state-${{ steps.inputs.outputs.key }}

  suite:
    needs: build
    if: needs.build.outputs.verdict == 'test'
    uses: ./.github/workflows/farm-test.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
      base: ${{ needs.build.outputs.base }}
      farm-runner: ${{ inputs.farm-runner }}

  # The code-health ratchet (north harness/code-health) on the candidate, beside the suite: land refuses new debt.
  code-health:
    needs: build
    if: needs.build.outputs.verdict == 'test' || needs.build.outputs.verdict == 'tested'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      detail: ${{ steps.gate.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm i -g @ast-grep/cli@0.42.1
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - id: gate
        env:
          BASE: ${{ needs.build.outputs.base }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set +e -uo pipefail
          bun "$RUNNER_TEMP/north/harness/code-health/cli.ts" gate "$BASE" "$SHA" > gate.log 2>&1
          code=$?
          cat gate.log
          case "$code" in 0) verdict=pass ;; 1) verdict=debt ;; *) verdict=error ;; esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          { echo "detail<<AUTOLAND_EOF"; tail -40 gate.log; echo "AUTOLAND_EOF"; } >> "$GITHUB_OUTPUT"
          echo "code-health gate ${BASE:0:10}..${SHA:0:10}: $verdict" >> "$GITHUB_STEP_SUMMARY"

  land:
    needs: [build, reports, suite, code-health]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.verdict != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERDICT: ${{ needs.reports.outputs.verdict || needs.build.outputs.verdict }}
      REPORTS: ${{ needs.reports.result }}
      SHA: ${{ needs.reports.outputs.sha || needs.build.outputs.sha }}
      TREE: ${{ needs.build.outputs.tree }}
      BASE: ${{ needs.build.outputs.base }}
      SCRATCH: ${{ needs.build.outputs.scratch }}
      BRANCHES: ${{ needs.build.outputs.branches }}
      TIPS: ${{ needs.build.outputs.tips }}
      DETAIL: ${{ needs.reports.outputs.detail || needs.build.outputs.detail }}
      CODE_HEALTH: ${{ needs.code-health.result }}
      CODE_HEALTH_VERDICT: ${{ needs.code-health.outputs.verdict }}
      CODE_HEALTH_DETAIL: ${{ needs.code-health.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - if: env.VERDICT == 'test'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: farm-test-summary
          path: candidate
      - id: land
        run: |
          set +e -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          read -ra branches <<< "$BRANCHES"
          read -ra tips <<< "$TIPS"
          status() { gh api "repos/$GH_REPO/statuses/$1" -f state="$2" -f context=autoland -f description="${3:0:139}" -f target_url="$RUN_URL" > /dev/null; }
          eval "$LOCAL_REFRESH"
          git fetch -q origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          why=""; failed=""
          if [ "$REPORTS" != success ] && [ "$REPORTS" != skipped ]; then
            why="regenerating the reports ended without a result"
          elif [ "$VERDICT" = targets ]; then
            why="the regenerated advantage state misses targets in docs/gameplay-design.md (Advantage state, Combo structure)"; failed=$(printf '```\n%s\n```' "$DETAIL")
          elif [ "$VERDICT" = check ]; then
            why="the checks failed"; failed=$(printf '```\n%s\n```' "$DETAIL")
          elif [ "$VERDICT" = test ] && [ ! -f candidate/summary.json ]; then
            why="the suite run ended without a result"
          elif [ "$VERDICT" = test ]; then
            failed=$(jq -r '.failures[], .problems[]' candidate/summary.json | sed 's/^/- /')
            [ -z "$failed" ] || why="$(grep -c . <<< "$failed") failing; main lands only on a green suite, including tests main already fails"
          fi
          if [ -z "$why" ]; then
            if [ "$CODE_HEALTH" != success ] && [ "$CODE_HEALTH" != skipped ]; then
              why="the code-health gate ended without a result"
            elif [ "$CODE_HEALTH_VERDICT" = debt ]; then
              why="it adds code-health debt"; failed=$(printf '```\n%s\n```' "$CODE_HEALTH_DETAIL")
            elif [ "$CODE_HEALTH_VERDICT" = error ]; then
              why="the code-health gate failed to run"; failed=$(printf '```\n%s\n```' "$CODE_HEALTH_DETAIL")
            fi
          fi
          if [ -n "$TEST" ] && [ "$(git rev-parse -q --verify "refs/remotes/origin/${branches[0]}")" != "${tips[0]}" ]; then
            echo "\`${branches[0]}\` moved or landed while it was tested: its new tip is tested on its own" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          passed_alone() {
            status "${tips[0]}" pending "passed alone on $BASE as tree $TREE"
            echo "\`${branches[0]}\` passed alone on main ${BASE:0:10}: $1, so it joins the next train" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -n "$why" ] && hand_back_record "$DETAIL"; then exit 1; fi
          verdict=$(bun ts/scripts/autoland.ts judge --count "${#branches[@]}" --green "$([ -z "$why" ] && echo true || echo false)")
          if [ "$verdict" = retest ]; then
            for tip in "${tips[@]}"; do status "$tip" pending queued; done
            echo "Train ${SHA:0:10} failed ($why): each of its tips is tested alone again on main" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$verdict" = fail ]; then
            tip=${tips[0]}
            gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs' > ci-jobs.json || echo '[]' > ci-jobs.json
            for id in $(jq -r '.[] | select(.conclusion != "" and .conclusion != "success" and .conclusion != "skipped") | .databaseId' ci-jobs.json); do
              gh api "repos/$GH_REPO/check-runs/$id/annotations" --jq "{\"$id\": [.[] | select(.annotation_level == \"failure\") | if (.title // \"\") != \"\" then \"\(.title): \(.message)\" else .message end]}" || echo '{}'
            done | jq -s 'add // {}' > failures.json
            jq --slurpfile failures failures.json 'map(. + {failures: ($failures[0][.databaseId | tostring] // [])})' ci-jobs.json > jobs.json
            rerun=$(bun ts/scripts/autoland.ts rerun --jobs jobs.json --attempt "$GITHUB_RUN_ATTEMPT" --count "$(jq '.failures | length' candidate/summary.json 2> /dev/null || echo 0)")
            if [ -n "$rerun" ]; then
              status "$tip" pending "rerunning run $GITHUB_RUN_ID: $rerun"
              echo "\`${branches[0]}\` measured nothing ($rerun): the sweep reruns the failed jobs once; the lane stays pending" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            status "$tip" failure "${SHA:+on ${SHA:0:10}: }$why"
            eval "$FLAG_CONFLICT"; base=$BASE
            flag "${branches[0]}" "$tip" "lane failed: $why. Push a fix to the branch, or restaff the issue." failed
            { echo "Autoland didn't land \`${branches[0]}\`${SHA:+ (${SHA:0:10}, rebased onto main ${BASE:0:10})}: $why:"; echo; printf '%s\n' "$failed" | head -60
              echo; echo "The branch stays; push a fix to it and it tries again."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Autoland didn't land::${branches[0]}${SHA:+ (${SHA:0:10})}: $why"
            exit 1
          fi
          git fetch -q origin main "$SCRATCH"
          main=$(git rev-parse origin/main)
          if [ "$main" != "$BASE" ]; then
            mkdir -p trees
            git ls-tree -r -z "$BASE" > trees/base
            git ls-tree -r -z "$SHA" > trees/tested
            mains=(); landed=()
            if git merge-base --is-ancestor "$BASE" "$main"; then
              for commit in $(git rev-list --reverse --first-parent "$BASE..$main"); do
                git ls-tree -r -z "$commit" > "trees/$commit"; mains+=("trees/$commit")
              done
            fi
            git worktree add -q --detach "$RUNNER_TEMP/past-main" "$SHA"
            if git -C "$RUNNER_TEMP/past-main" rebase -q --onto "$main" "$BASE" > rebase.log 2>&1; then
              git ls-tree -r -z "$(git -C "$RUNNER_TEMP/past-main" rev-parse HEAD)" > trees/landed; landed=(--rebased trees/landed)
            fi
            case "$(bun ts/scripts/autoland.ts landing --solo "$([ -n "$TEST" ] && echo true || echo false)" trees/base trees/tested "${mains[@]}" "${landed[@]}")" in
              land) ;;
              passed) passed_alone "main moved to ${main:0:10} on its paths while it was tested"; exit 0 ;;
              *) echo "main moved to ${main:0:10} on paths the train changes while it ran: its tips wait for the next train" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            esac
            SHA=$(git -C "$RUNNER_TEMP/past-main" rev-parse HEAD)
            echo "main moved to ${main:0:10} only on paths the train doesn't change: the tested tree lands rebased onto it as ${SHA:0:10}" >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$RUNNER_TEMP/autoland"
          cp ts/scripts/autoland.ts ts/scripts/autolandCore.ts "$RUNNER_TEMP/autoland/"
          late_cli="$RUNNER_TEMP/autoland/autoland.ts"
          solo_sha="$SHA"
          if [ -n "$TRAIN" ] && [ "${#branches[@]}" = 1 ]; then
            eval "$PASSED"
            if bash -euo pipefail -c "$FETCH_LANES" > lanes.json && bun ts/scripts/autoland.ts train --lanes lanes.json > late.tsv; then
              while IFS=$'\t' read -r -u 3 branch tip passed_base passed_tree; do
                [ "$branch" != "${branches[0]}" ] || continue
                [ "$(git rev-parse -q --verify "refs/remotes/origin/$branch")" = "$tip" ] || continue
                git checkout -q --detach "$tip" || continue
                if ! git rebase -q "$SHA" > rebase.log 2>&1; then
                  git rebase --abort
                  git checkout -q --detach "$SHA"
                  continue
                fi
                if [ "$(passed "$tip" "$passed_base" "$passed_tree" "$SHA" HEAD "$branch" "${branches[*]}")" != regenerate ]; then
                  git checkout -q --detach "$SHA"
                  continue
                fi
                lane_count=$(git rev-list --count --first-parent "$SHA..HEAD")
                [ "$lane_count" -gt 0 ] || { git checkout -q --detach "$SHA"; continue; }
                if [ "$lane_count" -gt 0 ]; then
                  git log --format=%B "$SHA..HEAD" > lane-messages.txt
                  issues=$(bun ts/scripts/autoland.ts refs --messages lane-messages.txt | jq -s .) || exit 1
                  lane=$(jq -cn --arg branch "$branch" --argjson count "$lane_count" --argjson issues "$issues" '{branch: $branch, count: $count, issues: $issues}') || exit 1
                  git commit --amend -q --no-edit --trailer "Autoland-Lane: $lane" || exit 1
                fi
                : > "$RUNNER_TEMP/late-reports"
                green=false
                if SCRATCH="" BRANCHES="${branches[*]} $branch" GITHUB_OUTPUT="$RUNNER_TEMP/late-reports" bash -euo pipefail -c 'eval "$REPORTS_RUN"; install_reports; regenerate_reports' && [ "$(sed -n 's/^verdict=//p' "$RUNNER_TEMP/late-reports")" = "$VERDICT" ]; then green=true; fi
                mains=()
                for commit in $(git rev-list --reverse --first-parent "$passed_base..$SHA"); do mains+=("$RUNNER_TEMP/trees/$commit"); done
                if [ "$(bun "$late_cli" late "$branch" "$(cat "$RUNNER_TEMP/trees/actual")" "$RUNNER_TEMP/trees/base" "$RUNNER_TEMP/trees/tested" "${mains[@]}" --rebased "$RUNNER_TEMP/trees/landed" --lanes lanes.json --retry "${branches[*]}" --green "$green")" != land ]; then
                  git reset --hard -q "$SHA"
                  git checkout -q --detach "$SHA"
                  break
                fi
                SHA=$(git rev-parse HEAD)
                branches+=("$branch"); tips+=("$tip")
                echo "Added \`$branch\` to the train with the combined passed-alone tree proof" >> "$GITHUB_STEP_SUMMARY"
                break
              done 3< late.tsv
            fi
          fi
          if ! git push origin "$SHA:refs/heads/main" 2> push.log; then
            cat push.log
            if hand_back_record "$(cat push.log)"; then exit 1; fi
            if [ "$SHA" != "$solo_sha" ] && grep -Eq 'non-fast-forward|fetch first' push.log && git push origin "$solo_sha:refs/heads/main" 2> push.log; then
              SHA="$solo_sha"; branches=("${branches[0]}"); tips=("${tips[0]}")
            else
              cat push.log
              if hand_back_record "$(cat push.log)"; then exit 1; fi
              if [ -n "$TEST" ]; then
                passed_alone "pushing it to main failed"
                if grep -Eq 'non-fast-forward|fetch first' push.log; then exit 0; fi
                exit 1
              fi
              echo "pushing to main failed: the train's tips wait for the next train" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "landed=1" >> "$GITHUB_OUTPUT"
          for i in "${!branches[@]}"; do
            status "${tips[i]}" success "landed as $SHA"
            git push -q --force-with-lease="refs/heads/${branches[i]}:${tips[i]}" origin ":refs/heads/${branches[i]}" \
              || echo "::warning::${branches[i]} moved after it was queued: kept it"
          done
          # Pushes made with this token start no workflows: start main's CI (main-red follows it).
          gh workflow run ci.yml --ref main || echo "::warning::couldn't start main's CI"
          gh workflow run background-sweeps.yml --ref main -f ref="$SHA"
          gh workflow run autoclose.yml --ref main -f sha="$SHA" -f base="$main" || echo "::warning::couldn't start auto-close"
          echo "Landed ${SHA:0:10} on main:$(printf ' `%s`' "${branches[@]}")" | tee -a "$GITHUB_STEP_SUMMARY"
      # A landed copy leaves its source branch behind: delete codex/, claude/ and farm/ branches main holds patch for patch.
      - if: success() && (env.TRAIN != '' || steps.land.outputs.landed == '1')
        run: |
          set +e -uo pipefail
          git fetch -q --prune origin main '+refs/heads/codex/*:refs/remotes/origin/codex/*' \
            '+refs/heads/claude/*:refs/remotes/origin/claude/*' '+refs/heads/farm/*:refs/remotes/origin/farm/*'
          now=$(date +%s)
          git for-each-ref --format='%(refname:lstrip=3) %(objectname) %(committerdate:unix)' \
              refs/remotes/origin/codex refs/remotes/origin/claude refs/remotes/origin/farm |
          while read -r branch tip at; do
            [ $((now - at)) -ge 600 ] || continue
            cherry=$(git cherry origin/main "$tip") || continue
            ! grep -q '^+' <<< "$cherry" || continue
            state=$(gh api "repos/$GH_REPO/commits/$tip/status" --jq '[.statuses[] | select(.context == "autoland")][0].state // ""')
            [ "$state" != pending ] || continue
            git push -q --force-with-lease="refs/heads/$branch:$tip" origin ":refs/heads/$branch" \
              && echo "main holds every patch of \`$branch\`: deleted it" >> "$GITHUB_STEP_SUMMARY"
          done
      - if: always() && env.SCRATCH != ''
        run: git push origin --delete "$SCRATCH" || true

  plan:
    needs: [build, suite, land]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    concurrency:
      group: autoland-plan-step
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - env:
          RETRY: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bash -euo pipefail -c "$FETCH_LANES" > lanes.json && jq -e 'type == "array"' lanes.json > /dev/null; then break; fi
            [ "$attempt" != 3 ] || { echo "::error title=Autoland plan input::lanes.json is empty or truncated after 3 fetches"; exit 1; }
            sleep $(( attempt * 5 ))
          done
          eval "$FLAG_CONFLICT"
          git fetch -q --filter=blob:none origin main '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          base=$(git rev-parse origin/main)
          jq -r '.[] | select(.status.state == "pending") | "\(.branch)\t\(.tip)"' lanes.json > pending.tsv
          while IFS=$'\t' read -r -u 3 branch tip; do
            git cat-file -e "$tip" 2> /dev/null || continue
            if git merge-tree --write-tree --name-only --no-messages "$base" "$tip" > merge.txt 2> /dev/null; then continue; fi
            files=$(tail -n +2 merge.txt | sort -u)
            [ -n "$files" ] || continue
            for file in $files; do jq -n --arg path "$file" '{path: $path, base: "", ours: "", theirs: ""}'; done | jq -s . > conflicts.json
            IFS=$'\t' read -r action note _ <<< "$(bun ts/scripts/autoland.ts resolve --conflicts conflicts.json --store /nonexistent || printf 'flag\tresolving failed')"
            if [ "$action" = resolve ]; then
              echo "\`$branch\` (${tip:0:10}) conflicts with main ${base:0:10} only in generated reports: its test regenerates them" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            files=$(echo $files)
            gh api "repos/$GH_REPO/statuses/$tip" -f state=failure -f context=autoland -f description="$(echo "conflicts with main ${base:0:10} in $files" | cut -c1-139)" -f target_url="$RUN_URL" > /dev/null || echo "::warning::couldn't fail $branch's status"
            flag "$branch" "$tip" "conflicts in \`$files\` with main ${base:0:10} (dry merge). Not auto-resolved: $note. Push a rebased fix to the branch." alarm || true
            echo "Autoland didn't land \`$branch\` (${tip:0:10}): conflicts with main ${base:0:10} in $files ($note)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Autoland didn't land::$branch (${tip:0:10}): conflicts with main in $files"
            jq --arg branch "$branch" 'map(select(.branch != $branch))' lanes.json > lanes.next && mv lanes.next lanes.json
          done 3< pending.tsv
          if [ "${{ vars.AUTOLAND_HEARTBEAT }}" != off ]; then
            beating=0
            for state in requested pending waiting queued in_progress; do
              beating=$(( beating + $(gh api "repos/$GH_REPO/actions/workflows/autoland-heartbeat.yml/runs?status=$state&per_page=1" --jq .total_count) ))
            done
            [ "$beating" != 0 ] || gh workflow run autoland-heartbeat.yml --ref main || echo "::warning::couldn't start the Autoland heartbeat"
          fi
          for state in requested pending waiting queued in_progress; do
            gh api "repos/$GH_REPO/actions/workflows/autoland.yml/runs?status=$state&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {id, title: .display_title, status}"
          done | jq -c . | while read -r run; do
            case "$(jq -r .status <<< "$run")" in
              queued | in_progress) gh api "repos/$GH_REPO/actions/runs/$(jq -r .id <<< "$run")/jobs?per_page=100" \
                --jq '[.jobs[] | {name, status, created: .created_at, started: .started_at, labels}]' | jq -c --argjson run "$run" '$run + {jobs: .}' ;;
              *) jq -c '. + {jobs: []}' <<< "$run" ;;
            esac
          done | jq -s . > runs.json
          echo "Autoland hosted jobs: $(bun ts/scripts/autoland.ts busy --runs runs.json)" >> "$GITHUB_STEP_SUMMARY"
          jq -e 'type == "array"' runs.json > /dev/null || { echo "::error title=Autoland plan input::runs.json is empty or truncated"; exit 1; }
          bun ts/scripts/autoland.ts plan --lanes lanes.json --runs runs.json --retry "$RETRY" > plan.tsv
          while IFS=$'\t' read -r -u 3 action branch tip slot; do
            if [ "$action" = test ] && [[ " $RETRY " != *" $branch "* ]]; then
              gh api "repos/$GH_REPO/commits/$tip/statuses?per_page=100" --jq '[.[] | select(.context == "autoland") | .description]' > statuses.json
              if [ "$(bun ts/scripts/autoland.ts loop --statuses statuses.json)" = true ]; then
                why="tested alone 3 times without landing; retry with -f branch=$branch"
                gh api "repos/$GH_REPO/statuses/$tip" -f state=failure -f context=autoland -f description="${why:0:139}" -f target_url="$RUN_URL" > /dev/null
                echo "Autoland didn't land \`$branch\` (${tip:0:10}): $why" >> "$GITHUB_STEP_SUMMARY"
                echo "::error title=Autoland didn't land::$branch (${tip:0:10}): $why"
                flag "$branch" "$tip" "lane failed: $why." failed || true
                continue
              fi
            fi
            if [ "$action" = test ]; then
              gh api "repos/$GH_REPO/statuses/$tip" -f state=pending -f context=autoland -f description="waiting to test alone" -f target_url="$RUN_URL" > /dev/null
              gh workflow run autoland.yml --ref main -f test="$branch $tip" -f slot="$slot"
              echo "testing \`$branch\` (${tip:0:10}) alone in slot $slot" >> "$GITHUB_STEP_SUMMARY"
            else
              gh workflow run autoland.yml --ref main -f train=1
              echo "started a train for the tips that passed alone" >> "$GITHUB_STEP_SUMMARY"
            fi
          done 3< plan.tsv
