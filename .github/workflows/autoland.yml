name: Autoland
on:
  workflow_dispatch:
run-name: Watchdog isolated slow build probe
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inject a slow first attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "probe started=$(date -u +%Y-%m-%dT%H:%M:%SZ) attempt=$ATTEMPT"
          if [ "$ATTEMPT" = 1 ]; then sleep 600; fi
          echo "probe finished=$(date -u +%Y-%m-%dT%H:%M:%SZ) attempt=$ATTEMPT"
