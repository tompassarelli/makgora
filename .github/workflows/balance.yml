name: Balance

# The balance gate's computer field (smashcraft:docs/design/roster.md, "Balance
# gate") on free hosted runners: `bun wisp farm balance` dispatches it. Every
# pair of selectable fighters at the commit is played by its own
# `cpuField --pairs` process, one a core, then one job merges the shards. On
# a full-roster run each fighter's spam probe (smashcraft:docs/design/balance.md)
# then attacks only with its top damage move against every other fighter, one
# process a core, and the verdict job writes the field, style, conversion and
# balance tables with both verdicts to the run's summary.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to measure, on main or on the lane
        default: main
      lane:
        description: The claude/ lane or probe/ branch whose tip this measures; empty for main
        default: ""
      opponent:
        description: Both computers' named opponent
        default: "wren"
      tier:
        description: Both computers' difficulty
        default: "expert"
      per-pair:
        description: Matches a pair
        default: "400"
      seeds:
        description: Seeds a setup may draw on to reach the matches a pair
        default: "100"
      matchups:
        description: Optional comma-separated fighter:opponent pairs for a named repair
        default: ""
      probe:
        description: Spam-probe matches a pair (0 skips the probe; a matchups run never probes)
        default: "40"
      ledge-rule:
        description: Optional cpuField ledge rule (melee for the melee ledge baseline); empty plays the shipped rules
        default: ""
      tag:
        description: Names the run so `bun wisp farm` can find the one it dispatched
        default: ""
      farm-runner:
        description: Runner label for the shard and probe jobs for a one-off measurement; background routing is checked in this workflow
        default: ""

run-name: Balance ${{ inputs.ref }} ${{ inputs.lane }} ${{ inputs.opponent }} ${{ inputs.tier }} ${{ inputs.per-pair }} a pair ${{ inputs.tag }}

concurrency:
  group: balance ${{ inputs.ref == 'main' && github.sha || inputs.ref }} ${{ inputs.lane || 'main' }} ${{ inputs.opponent }} ${{ inputs.tier }} ${{ inputs.per-pair }} ${{ inputs.matchups && inputs.tag }} ${{ inputs.ledge-rule }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      jobs: ${{ steps.plan.outputs.jobs }}
      ceilings: ${{ steps.plan.outputs.ceilings }}
      parallel: ${{ steps.plan.outputs.parallel }}
      admission: ${{ steps.plan.outputs.admission }}
      probes: ${{ steps.plan.outputs.probes }}
      shard-timeout: ${{ steps.plan.outputs.shard-timeout }}
      probe-timeout: ${{ steps.plan.outputs.probe-timeout }}
      background-runner: ${{ steps.plan.outputs.background-runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts scripts/runnerRoute.ts runner-routing.json
          bun scripts/farmGuard.ts --workflow balance --sha "$(git rev-parse HEAD)" --lane "$LANE"
      - id: plan
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          MATCHUPS: ${{ inputs.matchups }}
          PER_PAIR: ${{ inputs.per-pair }}
          PROBE: ${{ inputs.probe }}
          FARM_INPUT: ${{ inputs.farm-runner }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bun scripts/farmGuard.ts --per-pair "$PER_PAIR" --probe "$PROBE" >> "$GITHUB_OUTPUT"
          bun scripts/balancePlan.ts >> "$GITHUB_OUTPUT"
          bun scripts/runnerRoute.ts --routing runner-routing.json --class background --override "$FARM_INPUT" --want "$(sed -n 's/^parallel=//p' "$GITHUB_OUTPUT")" | tee -a "$GITHUB_STEP_SUMMARY" | sed -n 's/^runner=/background-runner=/p' >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && needs.plan.outputs.background-runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.shard-timeout) }}
    strategy:
      fail-fast: true
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        pairs: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - if: runner.environment == 'github-hosted'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The farm box keeps a mirror of the repository (/srv/farm-mirror, refreshed each minute): fetch only what it lacks.
      - if: runner.environment == 'self-hosted'
        name: Check out from the farm box's mirror
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          [ ! -f .git/shallow ] || rm -rf .git
          git init -q .
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          mirror="/srv/farm-mirror/${GITHUB_REPOSITORY#*/}.git/objects"
          if [ -d "$mirror" ]; then echo "$mirror" > .git/objects/info/alternates; fi
          git -c gc.auto=0 fetch -q --no-tags origin "$SHA"
          git checkout -q --force --detach "$SHA"
          git clean -q -ffdx
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts
          bun scripts/farmGuard.ts --workflow balance --sha "$SHA" --lane "$LANE"
      - name: Play the pairs, one process a core
        working-directory: ts
        env:
          PAIRS: ${{ matrix.pairs }}
          OPPONENT: ${{ inputs.opponent }}
          TIER: ${{ inputs.tier }}
          PER_PAIR: ${{ inputs.per-pair }}
          SEEDS: ${{ inputs.seeds }}
          LEDGE_RULE: ${{ inputs.ledge-rule }}
        run: |
          mkdir -p shards
          printf '%s' "$PAIRS" | tr ',' '\0' | xargs -0 -P "$(nproc)" -I{} sh -c '
            name=$(printf "%s" "$1" | tr : _)
            bun scripts/cpuField.ts --pairs "$1" --opponents "$OPPONENT,$OPPONENT" --tiers "$TIER,$TIER" --per-pair "$PER_PAIR" --seeds "$SEEDS" ${LEDGE_RULE:+--ledge-rule "$LEDGE_RULE"} --json "shards/$name.json" > "shards/$name.log" 2>&1 \
              || { echo "::error::cpuField $1 failed"; cat "shards/$name.log"; exit 1; }
            grep -m1 "computer matches" "shards/$name.log" | cut -c1-90
          ' sh '{}'
      - uses: actions/upload-artifact@v4
        with:
          name: balance-shard-${{ strategy.job-index }}
          path: ts/shards/*.json
          retention-days: 3
      - name: Record this shard's measured work for the next balance plan
        working-directory: ts
        run: bun scripts/balanceTimings.ts > shard-timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-timings-shard-${{ strategy.job-index }}
          path: ts/shard-timings.json
          retention-days: 30

  merge:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-shard-*
          merge-multiple: true
          path: ts/shards
      - name: Merge the field
        working-directory: ts
        env:
          OPPONENT: ${{ inputs.opponent }}
          TIER: ${{ inputs.tier }}
          PER_PAIR: ${{ inputs.per-pair }}
          SEEDS: ${{ inputs.seeds }}
          LEDGE_RULE: ${{ inputs.ledge-rule }}
        run: |
          mkdir -p balance
          bun scripts/cpuField.ts --merge "$(ls shards/*.json | paste -sd,)" --opponents "$OPPONENT,$OPPONENT" --tiers "$TIER,$TIER" --per-pair "$PER_PAIR" --seeds "$SEEDS" ${LEDGE_RULE:+--ledge-rule "$LEDGE_RULE"} --json balance/field.json > balance/merged.md
      - uses: actions/upload-artifact@v4
        with:
          name: balance-merged
          path: ts/balance/field.json
          retention-days: 3

  probe:
    needs: [plan, merge]
    if: ${{ inputs.matchups == '' && inputs.probe != '0' }}
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && needs.plan.outputs.background-runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.probe-timeout) }}
    strategy:
      fail-fast: true
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        fighters: ${{ fromJSON(needs.plan.outputs.probes) }}
    steps:
      - if: runner.environment == 'github-hosted'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The farm box keeps a mirror of the repository (/srv/farm-mirror, refreshed each minute): fetch only what it lacks.
      - if: runner.environment == 'self-hosted'
        name: Check out from the farm box's mirror
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          [ ! -f .git/shallow ] || rm -rf .git
          git init -q .
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          mirror="/srv/farm-mirror/${GITHUB_REPOSITORY#*/}.git/objects"
          if [ -d "$mirror" ]; then echo "$mirror" > .git/objects/info/alternates; fi
          git -c gc.auto=0 fetch -q --no-tags origin "$SHA"
          git checkout -q --force --detach "$SHA"
          git clean -q -ffdx
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts
          bun scripts/farmGuard.ts --workflow balance --sha "$SHA" --lane "$LANE"
      - uses: actions/download-artifact@v4
        with:
          name: balance-merged
          path: ts/balance
      - name: Play each fighter's spam probe, one process a core
        working-directory: ts
        env:
          FIGHTERS: ${{ matrix.fighters }}
          OPPONENT: ${{ inputs.opponent }}
          TIER: ${{ inputs.tier }}
          PROBE: ${{ inputs.probe }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          mkdir -p probes
          printf '%s' "$FIGHTERS" | tr ',' '\0' | xargs -0 -P "$(nproc)" -I{} sh -c '
            name=$(printf "%s" "$1" | tr "@/" "__")
            fighter=${1%@*}
            part=${1#*@}
            bun scripts/cpuField.ts --probe-fighter "$fighter" --partition "$part" --from balance/field.json --opponents "$OPPONENT,$OPPONENT" --tiers "$TIER,$TIER" --per-pair "$PROBE" --seeds "$SEEDS" --json "probes/$name.json" > "probes/$name.log" 2>&1 \
              || { echo "::error::spam probe $1 failed"; cat "probes/$name.log"; exit 1; }
            grep -m1 "computer matches" "probes/$name.log" | cut -c1-90
          ' sh '{}'
      - uses: actions/upload-artifact@v4
        with:
          name: balance-probe-${{ strategy.job-index }}
          path: ts/probes/*.json
          retention-days: 3

  ceiling-plan:
    needs: [plan, merge, probe]
    if: ${{ always() && needs.merge.result == 'success' && needs.probe.result != 'failure' && needs.probe.result != 'cancelled' && inputs.matchups == '' && inputs.opponent == 'wren' && inputs.tier == 'expert' && fromJSON(inputs.per-pair) >= 400 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parallel: ${{ steps.admit.outputs.parallel }}
      admission: ${{ steps.admit.outputs.admission }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - id: admit
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/farmAdmission.ts >> "$GITHUB_OUTPUT"

  ceiling:
    needs: [plan, ceiling-plan]
    if: ${{ always() && needs.ceiling-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      max-parallel: ${{ fromJSON(needs.ceiling-plan.outputs.parallel) }}
      matrix:
        pairs: ${{ fromJSON(needs.plan.outputs.ceilings) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts
          bun scripts/farmGuard.ts --workflow balance --sha "$SHA" --lane "$LANE"
      - name: Play the player panel and final skill profiles
        working-directory: ts
        env:
          PAIRS: ${{ matrix.pairs }}
        run: |
          mkdir -p ceiling
          printf '%s' "$PAIRS" | tr ',' '\0' | xargs -0 -P "$(nproc)" -I{} sh -c '
            name=$(printf "%s" "$1" | tr ":@/" "___")
            pair=${1%@*}
            part=${1#*@}
            depth=""
            case "$pair" in rifleman:*) depth=${pair#*:} ;; esac
            case "$pair" in rifleman:illidan) depth="$depth,rifleman" ;; esac
            bun scripts/cpuCeiling.ts --pairs "$pair" --partition "$part" --depth "$depth" --json "ceiling/$name.json" > "ceiling/$name.log" 2>&1 \
              || { cat "ceiling/$name.log"; exit 1; }
          ' sh '{}'
      - uses: actions/upload-artifact@v4
        with:
          name: balance-ceiling-${{ strategy.job-index }}
          path: ts/ceiling/*.json
          retention-days: 3

  verdict:
    needs: [plan, shard, merge, probe, ceiling-plan, ceiling]
    if: ${{ always() && needs.merge.result == 'success' && needs.probe.result != 'failure' && needs.probe.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-shard-*
          merge-multiple: true
          path: ts/shards
      - uses: actions/download-artifact@v4
        if: ${{ needs.probe.result == 'success' }}
        with:
          pattern: balance-probe-*
          merge-multiple: true
          path: ts/probes
      - uses: actions/download-artifact@v4
        if: ${{ needs.ceiling.result == 'success' }}
        with:
          pattern: balance-ceiling-*
          merge-multiple: true
          path: ts/ceiling
      - name: Merge and print the verdicts
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          OPPONENT: ${{ inputs.opponent }}
          TIER: ${{ inputs.tier }}
          PER_PAIR: ${{ inputs.per-pair }}
          SEEDS: ${{ inputs.seeds }}
          PROBE: ${{ inputs.probe }}
          SHA: ${{ needs.plan.outputs.sha }}
          MATCHUPS: ${{ inputs.matchups }}
          LEDGE_RULE: ${{ inputs.ledge-rule }}
        run: |
          mkdir -p balance probes
          bun scripts/cpuField.ts --merge "$(ls shards/*.json | paste -sd,)" --probe "$(ls probes/*.json 2>/dev/null | paste -sd,)" --opponents "$OPPONENT,$OPPONENT" --tiers "$TIER,$TIER" --per-pair "$PER_PAIR" --seeds "$SEEDS" ${LEDGE_RULE:+--ledge-rule "$LEDGE_RULE"} --json balance/field.json > balance/table.md
          if [ -d ceiling ]; then
            bun scripts/cpuCeiling.ts --merge "$(ls ceiling/*.json | paste -sd,)" --baseline balance/field.json --report balance/ceiling.md >> balance/table.md
          fi
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          wall=$(( $(date +%s) - $(date -d "$started" +%s) ))
          verdict="$(grep '^Balance gate' balance/table.md) $(grep '^Balanced' balance/table.md)"
          if [ -n "$MATCHUPS" ]; then
            verdict="Targeted matchup report: $MATCHUPS. Full-roster gate not measured."
          fi
          {
            echo "# Balance at ${SHA:0:10}"
            echo
            echo "${{ needs.plan.outputs.admission }}"
            echo "${{ needs.ceiling-plan.outputs.admission }}"
            echo
            echo "**${verdict}**"
            echo
            echo "$OPPONENT $TIER, $PER_PAIR a pair, $(ls shards/*.json | wc -l) pairs in ${{ needs.plan.outputs.jobs }} jobs; spam probe $PROBE a pair for $(ls probes/*.json 2>/dev/null | wc -l) fighters; $((wall / 60)) min $((wall % 60)) s from the run's start to the verdict."
            echo
            if [ -n "$MATCHUPS" ]; then
              grep -v -e '^Merged from' -e '^Balance gate' -e '^Balanced' balance/table.md
            else
              grep -v '^Merged from' balance/table.md
            fi
          } > balance/field.md
          cat balance/field.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Balance gate::$verdict"
      - uses: actions/upload-artifact@v4
        with:
          name: balance-field
          path: |
            ts/balance/field.md
            ts/balance/field.json
            ts/balance/ceiling.md
          retention-days: 30
      - name: Record measured work for the next balance plan
        working-directory: ts
        run: bun scripts/balanceTimings.ts > timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-timings
          path: ts/timings.json
          retention-days: 30
      - name: Check the required balance gate
        if: ${{ inputs.matchups == '' && inputs.opponent == 'wren' && inputs.tier == 'expert' && fromJSON(inputs.per-pair) >= 400 }}
        run: |
          grep -q '^Skill ceiling: pass.' ts/balance/table.md
          grep -q '^Balance gate .*: passes\.' ts/balance/table.md
          if [ "${{ inputs.probe }}" != "0" ]; then grep -q '^Balanced .*: passes\.' ts/balance/table.md; fi
