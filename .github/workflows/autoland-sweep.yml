name: Autoland sweep

on:
  workflow_run:
    workflows: [Autoland, Farm test]
    types: [requested, completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what the sweep would cancel without cancelling or replanning
        type: boolean
        default: false
      landed:
        description: "Treat main as last moved at this ISO time, to prove the stalled alarm without a real stall (smashcraft#513)"
        default: ""

permissions:
  actions: write
  contents: read
  issues: write
  statuses: read

# A burst collapses to the running sweep plus one pending; cancelling a running sweep could drop its replan.
concurrency:
  group: autoland-sweep
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  DRY_RUN: ${{ inputs.dry-run == true }}
  LANDED: ${{ inputs.landed }}
  STALLED_TITLE: Autoland stalled

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: ts/scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "${{ vars.AUTOLAND_HEARTBEAT }}" != off ] && [ "$DRY_RUN" = false ]; then
            beating=0
            for state in requested pending waiting queued in_progress; do
              beating=$(( beating + $(gh api "repos/$GH_REPO/actions/workflows/autoland-heartbeat.yml/runs?status=$state&per_page=1" --jq .total_count) ))
            done
            [ "$beating" != 0 ] || gh workflow run autoland-heartbeat.yml --ref main || echo "::warning::couldn't start the Autoland heartbeat"
          fi
          echo "Started by ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          last=$(gh api "repos/$GH_REPO/actions/workflows/autoland-sweep.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].updated_at // ""')
          if [ "${{ github.event_name }}" = workflow_run ] && [ -n "$last" ] && [ $(( $(date -d "$now" +%s) - $(date -d "$last" +%s) )) -lt 120 ]; then
            echo "A sweep finished at $last, under 2 minutes ago: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for workflow in autoland.yml farm-test.yml; do for state in requested pending waiting queued in_progress; do
            gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?status=$state&per_page=100" \
              --jq '.workflow_runs[] | {id, title: .display_title, status, created: .created_at}'
          done; done | jq -c . | while read -r run; do
            case "$(jq -r .status <<< "$run")" in
              queued | in_progress) gh api "repos/$GH_REPO/actions/runs/$(jq -r .id <<< "$run")/jobs?per_page=100" \
                --jq '[.jobs[] | {name, status, created: .created_at, started: .started_at, labels}]' | jq -c --argjson run "$run" '$run + {jobs: .}' ;;
              *) jq -c '. + {jobs: []}' <<< "$run" ;;
            esac
          done | jq -s . > runs.json
          bun ts/scripts/autoland.ts sweep --runs runs.json --now "$now" > cancel.tsv
          echo "$(jq length runs.json) unfinished Autoland and Farm test runs at $now; cancelling $(grep -c . cancel.tsv || true)" >> "$GITHUB_STEP_SUMMARY"
          cancelled=()
          replan=0
          while IFS=$'\t' read -r -u 3 id force requeue reason title; do
            echo "- [$title]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id): $reason" >> "$GITHUB_STEP_SUMMARY"
            [ "$DRY_RUN" = false ] || continue
            if gh api -X POST "repos/$GH_REPO/actions/runs/$id/$([ "$force" = true ] && echo force-cancel || echo cancel)" > /dev/null; then
              cancelled+=("$id")
              [ "$requeue" = false ] || replan=1
            else
              echo "::warning::couldn't cancel run $id"
            fi
          done 3< cancel.tsv
          for _ in $(seq 12); do
            open=0
            for id in "${cancelled[@]}"; do
              [ "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)" = completed ] || open=$((open + 1))
            done
            [ "$open" -gt 0 ] || break
            sleep 10
          done
          gh api graphql --paginate -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) { repository(owner: $owner, name: $name) {
            refs(refPrefix: "refs/heads/claude/", first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor }
            nodes { name target { oid ... on Commit { status { context(name: "autoland") { state description createdAt } } } } } } } }' \
            --jq '.data.repository.refs.nodes[] | {branch: ("claude/" + .name), tip: .target.oid,
              status: (.target.status.context | if . == null then null else {state: (.state | ascii_downcase), description, at: .createdAt} end)}' | jq -s . > lanes.json
          landed=${LANDED:-$(gh api "repos/$GH_REPO/activity?ref=refs/heads/main&per_page=1" --jq '.[0].timestamp')}
          stalled=$(bun ts/scripts/autoland.ts stalled --lanes lanes.json --landed "$landed" --now "$now")
          pending=$(jq '[.[] | select(.status.state == "pending")] | length' lanes.json)
          echo "main last moved at $landed; $pending lanes pending; stalled: $stalled" >> "$GITHUB_STEP_SUMMARY"
          [ "$DRY_RUN" = false ] || exit 0
          planning=$(jq '[.[] | select(.title | startswith("Autoland plan"))] | length' runs.json)
          if [ "$replan" = 1 ] || [ "$stalled" = true ] || { [ "$pending" -gt 0 ] && [ "$planning" = 0 ]; }; then
            gh workflow run autoland.yml --ref main
            echo "Requeued: dispatched an Autoland plan" >> "$GITHUB_STEP_SUMMARY"
          fi
          issue=$(gh issue list --state open --search "in:title \"$STALLED_TITLE\"" --json number,title,updatedAt \
            --jq "[.[] | select(.title == \"$STALLED_TITLE\")][0] // empty")
          if [ "$stalled" = true ]; then
            body="Main hasn't moved since $landed with $pending lanes pending. This sweep ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID) cancelled ${#cancelled[@]} stuck runs and dispatched an Autoland plan. Unfinished runs: $(jq length runs.json)."
            if [ -z "$issue" ]; then
              gh issue create --title "$STALLED_TITLE" --body "$body (smashcraft#513)"
            elif [ $(( $(date -d "$now" +%s) - $(date -d "$(jq -r .updatedAt <<< "$issue")" +%s) )) -ge 1800 ]; then
              gh issue comment "$(jq -r .number <<< "$issue")" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            number=$(jq -r .number <<< "$issue")
            { gh api "repos/$GH_REPO/issues/$number" --jq .body; gh api "repos/$GH_REPO/issues/$number/comments?per_page=100" --jq '.[].body'; } | jq -Rs '[.]' > bodies.json
            flagged=$(bun ts/scripts/autoland.ts flagged --bodies bodies.json --lanes lanes.json)
            if [ -n "$flagged" ]; then
              echo "The alarm stays open for conflicting lanes not yet pushed again, landed or deleted: $(cut -f1 <<< "$flagged" | xargs)" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue close "$number" --comment "Main moved at $landed and no flagged lane still waits at its conflicting tip: Autoland is flowing again."
            fi
          fi

  # A failed lane is superseded once main or a newer live claude/ lane holds every patch of it (git patch-id), or a
  # lane pushed after the failure refs the same issues: delete it and say so once on its issues (smashcraft#513).
  superseded:
    if: inputs.dry-run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      statuses: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: lanes
        run: |
          set -euo pipefail
          gh api graphql --paginate -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) { repository(owner: $owner, name: $name) {
            refs(refPrefix: "refs/heads/claude/", first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor }
            nodes { name target { oid ... on Commit { committedDate status { context(name: "autoland") { state createdAt } } } } } } } }' \
            --jq '.data.repository.refs.nodes[] | "claude/\(.name)\t\(.target.oid)\t\(.target.status.context.state // "NONE")\t\(.target.status.context.createdAt // "")\t\(.target.committedDate)"' > "$RUNNER_TEMP/lanes.tsv"
          echo "any=$(grep -qP '\tFAILURE\t' "$RUNNER_TEMP/lanes.tsv" && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.lanes.outputs.any == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - if: steps.lanes.outputs.any == 'true'
        run: |
          set -uo pipefail
          git fetch -q --filter=blob:none origin main '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          refs() { git log --format=%B "$(git merge-base origin/main "$1")..$1" | grep -oiE '\b(refs|fixes|closes)[: ]+((tompassarelli/)?smashcraft)?#[0-9]+' | grep -oE '[0-9]+$' | sort -un; }
          patches() { git log -p --no-merges "$(git merge-base origin/main "$1")..$1" | git patch-id --stable | cut -d' ' -f1; }
          live=$RUNNER_TEMP/live-patches; : > "$live"
          while IFS=$'\t' read -r -u 3 branch tip state _ _; do
            [ "$state" != FAILURE ] && git cat-file -e "$tip" 2> /dev/null && patches "$tip" >> "$live"
          done 3< "$RUNNER_TEMP/lanes.tsv"
          sort -u -o "$live" "$live"
          while IFS=$'\t' read -r -u 3 branch tip state failed _; do
            [ "$state" = FAILURE ] && git cat-file -e "$tip" 2> /dev/null || continue
            issues=$(refs "$tip")
            why=""
            unheld=$(git cherry origin/main "$tip" | sed -n 's/^+ //p' | while read -r c; do git show "$c" | git patch-id --stable | cut -d' ' -f1; done | sort -u)
            if [ -z "$unheld" ]; then
              why="main already holds every patch of it"
            elif [ -z "$(comm -23 <(echo "$unheld") "$live")" ]; then
              why="main and newer lanes hold every patch of it"
            elif [ -n "$issues" ]; then
              while IFS=$'\t' read -r -u 4 other otip ostate _ odate; do
                [ "$other" != "$branch" ] && [ "$ostate" != FAILURE ] && [[ "$odate" > "$failed" ]] && git cat-file -e "$otip" 2> /dev/null || continue
                [ -n "$(comm -12 <(echo "$issues") <(refs "$otip"))" ] && { why="\`$other\`, pushed after it failed, refs the same issue"; break; }
              done 4< "$RUNNER_TEMP/lanes.tsv"
            fi
            [ -n "$why" ] || continue
            git push -q --force-with-lease="refs/heads/$branch:$tip" origin ":refs/heads/$branch" || { echo "::warning::$branch moved: kept it"; continue; }
            echo "\`$branch\` failed and is superseded ($why): deleted it" >> "$GITHUB_STEP_SUMMARY"
            for issue in $issues; do
              gh issue comment "$issue" --body "Autoland: \`$branch\` (${tip:0:10}) failed and is superseded: $why. Deleted it ($RUN_URL)." > /dev/null || echo "::warning::couldn't comment on #$issue"
            done
          done 3< "$RUNNER_TEMP/lanes.tsv"
