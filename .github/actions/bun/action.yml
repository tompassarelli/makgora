name: Bun with its install cache
description: Restore bun 1.3.13 and its install cache from one cache entry, installing bun only on a miss.
runs:
  using: composite
  steps:
    - id: bun
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/bin
          ~/.bun/install/cache
        key: bun-1.3.13-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
    - if: steps.bun.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.13"
    - shell: bash
      run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
