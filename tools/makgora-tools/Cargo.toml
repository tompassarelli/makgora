[package]
name = "makgora-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT"
description = "Mak'gora's host tools: Warcraft III menu observation and input procedures, and the animation asset pipelines"

[dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"

[lints.clippy]
redundant_clone = "warn"
implicit_clone = "warn"
unnecessary_to_owned = "warn"
redundant_allocation = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
cloned_instead_of_copied = "warn"
